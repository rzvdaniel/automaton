name: automaton-prod

# Production stack: nginx + MySQL + API + Studio + Website
#
# Runners are deployed independently — see docker-compose.runner.yml or
# https://hub.docker.com/r/rzvdaniel/automaton-runner
#
# Prerequisites on the Hetzner server:
#   1. Clone this repo to /opt/automaton
#   2. Copy .env.prod.example to .env and fill in all values
#   3. Run ./scripts/prod-issue-certs.sh once to bootstrap or renew TLS certs
#   4. Use ./scripts/prod-redeploy-all.sh for normal blue/green deploys
#
# Cloudflare guidance:
#   - keep @, www, api, studio, and apps proxied once the stack is live
#   - set SSL/TLS mode to Full (strict)
#   - nginx uses static upstream selector files instead of dynamic Docker discovery

x-api-common: &api-common
  build:
    context: .
    dockerfile: docker/Dockerfile.server
  image: automaton-prod-api:latest
  restart: unless-stopped
  logging: &default-json-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  environment: &api-env
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    WebAppConfig__StaticRuntimeRoot: /app/AppData/static-runtime
    PublishedApps__RuntimeProxyAuthKey: ${RUNTIME_PROXY_AUTH_KEY:?RUNTIME_PROXY_AUTH_KEY is required in .env}
    PublishedApps__TraefikDynamicConfigRoot: /app/AppData/traefik-dynamic
    HostedRunners__Enabled: ${HOSTED_RUNNERS_ENABLED:-true}
    HostedRunners__DeploymentMode: ${HOSTED_RUNNERS_DEPLOYMENT_MODE:-sshDocker}
    HostedRunners__ServerUrl: https://${API_DOMAIN:?API_DOMAIN is required in .env}
    HostedRunners__DockerImage: ${HOSTED_RUNNER_DOCKER_IMAGE:-rzvdaniel/automaton-runner:latest}
    HostedRunners__DockerNetwork: ${HOSTED_RUNNER_DOCKER_NETWORK:-automaton-runtime}
    HostedRunners__RuntimeDockerNetwork: ${HOSTED_RUNNER_RUNTIME_DOCKER_NETWORK:-automaton-runtime}
  volumes:
    - prod-api-appdata:/app/AppData
    - prod-published-apps:/app/AppData/published-apps
    - prod-static-runtime:/app/AppData/static-runtime
    - prod-traefik-dynamic:/app/AppData/traefik-dynamic
    - prod-api-logs:/app/logs
    - /opt/automaton/config/appsettings.Production.json:/app/appsettings.Production.json:ro
    - /opt/automaton/secrets/hosted_runner_ssh_key:/run/secrets/hosted_runner_ssh_key:ro
  networks:
    - automaton-prod
  depends_on:
    mysql:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  image: automaton-prod-worker:latest
  restart: unless-stopped
  logging: *default-json-logging
  environment: &worker-env
    DOTNET_ENVIRONMENT: Production
    Logging__File__Path: /app/logs
    HostedRunners__Enabled: ${HOSTED_RUNNERS_ENABLED:-true}
    HostedRunners__DeploymentMode: ${HOSTED_RUNNERS_DEPLOYMENT_MODE:-sshDocker}
    HostedRunners__ServerUrl: https://${API_DOMAIN:?API_DOMAIN is required in .env}
    HostedRunners__DockerImage: ${HOSTED_RUNNER_DOCKER_IMAGE:-rzvdaniel/automaton-runner:latest}
    HostedRunners__DockerNetwork: ${HOSTED_RUNNER_DOCKER_NETWORK:-automaton-runtime}
    HostedRunners__RuntimeDockerNetwork: ${HOSTED_RUNNER_RUNTIME_DOCKER_NETWORK:-automaton-runtime}
  volumes:
    - prod-worker-logs:/app/logs
    - prod-worker-dataprotection:/app/data-protection-keys
    - /opt/automaton/config/appsettings.Production.json:/app/appsettings.Production.json:ro
  networks:
    - automaton-prod
  depends_on:
    mysql:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-studio-common: &studio-common
  build:
    context: .
    dockerfile: docker/Dockerfile.studio
    args:
      VITE_API_BASE_URL: https://${API_DOMAIN:?API_DOMAIN is required in .env}
      VITE_APP_TITLE: Automaton Studio
      VITE_ENABLE_MOCK_API: "false"
      VITE_SUBSCRIPTIONS_ENABLED: "true"
      VITE_PUBLIC_APPS_BASE_URL: https://${APPS_DOMAIN:?APPS_DOMAIN is required in .env}
  image: automaton-prod-studio:latest
  restart: unless-stopped
  logging: *default-json-logging
  networks:
    - automaton-prod
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

x-website-common: &website-common
  build:
    context: .
    dockerfile: docker/Dockerfile.website
  image: automaton-prod-website:latest
  restart: unless-stopped
  logging: *default-json-logging
  networks:
    - automaton-prod
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: automaton-nginx
    restart: unless-stopped
    logging: *default-json-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.prod-runtime/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.prod-runtime/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./.prod-runtime/nginx/upstreams:/etc/nginx/upstreams:ro
      - ./.prod-runtime/nginx/app-runtime:/var/www/automaton-app-runtime:ro
      - prod-published-apps:/var/www/automaton-apps:ro
      - prod-static-runtime:/var/www/automaton-private-runtime:ro
      - ./.prod-runtime/certbot-www:/var/www/certbot:ro
      - ./.prod-runtime/letsencrypt:/etc/letsencrypt:ro
    networks:
      - automaton-prod
      - automaton-runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/.well-known/acme-challenge/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  traefik:
    image: traefik:v3.1
    container_name: automaton-traefik
    restart: unless-stopped
    logging: *default-json-logging
    volumes:
      - ./.prod-runtime/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./.prod-runtime/traefik/api-edge.yml:/etc/traefik/dynamic/api-edge.yml:ro
      - ./.prod-runtime/letsencrypt/live/${CERT_NAME:-${WEBSITE_DOMAIN:?WEBSITE_DOMAIN is required in .env}}:/etc/traefik/certs:ro
      - prod-traefik-dynamic:/etc/traefik/dynamic
    networks:
      - automaton-runtime
      - automaton-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8082/ping | grep -q OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    logging: *default-json-logging
    volumes:
      - ./.prod-runtime/certbot-www:/var/www/certbot
      - ./.prod-runtime/letsencrypt:/etc/letsencrypt

  mysql:
    image: mysql:8.0
    container_name: automaton-prod-mysql
    restart: unless-stopped
    logging: *default-json-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automaton}
      MYSQL_USER: ${MYSQL_USER:-automaton_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - prod-mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - automaton-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: automaton-prod-rabbitmq
    restart: unless-stopped
    logging: *default-json-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - prod-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - automaton-prod
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *worker-common
    container_name: automaton-prod-worker

  api-blue:
    <<: *api-common
    environment:
      <<: *api-env
      AUTOMATON_API_COLOR: blue

  api-green:
    <<: *api-common
    environment:
      <<: *api-env
      AUTOMATON_API_COLOR: green

  studio-blue:
    <<: *studio-common

  studio-green:
    <<: *studio-common

  website-blue:
    <<: *website-common

  website-green:
    <<: *website-common

volumes:
  prod-mysql-data:
  prod-rabbitmq-data:
  prod-api-appdata:
  prod-published-apps:
  prod-static-runtime:
  prod-traefik-dynamic:
  prod-api-logs:
  prod-worker-logs:
  prod-worker-dataprotection:

networks:
  automaton-prod:
    driver: bridge
  automaton-runtime:
    driver: bridge
    internal: true
