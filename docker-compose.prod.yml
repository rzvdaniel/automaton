name: automaton-prod

# Production stack: Traefik + MySQL + API + Studio + Website
#
# Runners are deployed independently — see docker-compose.runner.yml or
# https://hub.docker.com/r/rzvdaniel/automaton-runner
#
# Prerequisites on the Hetzner server:
#   1. Clone this repo to /opt/automaton
#   2. Copy .env.prod.example to .env and fill in all values
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Traefik will obtain Let's Encrypt TLS certificates automatically via HTTP challenge.
# Cloudflare note: disable "Always Use HTTPS" page rule during first startup so that
# Let's Encrypt can reach /.well-known/acme-challenge/ over HTTP. Re-enable after certs
# are issued, or switch to DNS challenge using CLOUDFLARE_DNS_API_TOKEN (see Traefik docs).

x-api-common: &api-common
  build:
    context: .
    dockerfile: docker/Dockerfile.server
  image: automaton-prod-api:latest
  restart: unless-stopped
  environment:
    # Must be env vars — read before the config pipeline starts
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    # Connection string stays here so ${MYSQL_PASSWORD} comes from .env (not hardcoded in JSON)
    ConnectionStrings__MySqlConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-automaton};User=${MYSQL_USER:-automaton_user};Password=${MYSQL_PASSWORD};
    # Everything else (CORS, JWT, RSA keys, HMAC, encryption key, Stripe, email, etc.)
    # is in /opt/automaton/config/appsettings.Production.json on the server.
  volumes:
    - prod-api-appdata:/app/AppData
    - prod-api-logs:/app/Logs
    # appsettings.Production.json lives on the server (outside the repo), never committed.
    # Create it at /opt/automaton/config/appsettings.Production.json — see .env.prod.example for structure.
    - /opt/automaton/config/appsettings.Production.json:/app/appsettings.Production.json:ro
  networks:
    - automaton-prod
  depends_on:
    mysql:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-studio-common: &studio-common
  build:
    context: .
    dockerfile: docker/Dockerfile.studio
    args:
      VITE_API_BASE_URL: https://${API_DOMAIN}
      VITE_APP_TITLE: Automaton Studio
      VITE_ENABLE_MOCK_API: "false"
      VITE_SUBSCRIPTIONS_ENABLED: "true"
  image: automaton-prod-studio:latest
  restart: unless-stopped
  networks:
    - automaton-prod
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

x-website-common: &website-common
  build:
    context: .
    dockerfile: docker/Dockerfile.website
    args:
      CLI_ARTIFACTS_IMAGE: automaton-website-cli:latest
  image: automaton-prod-website:latest
  restart: unless-stopped
  networks:
    - automaton-prod
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

services:

  # ── Docker Socket Proxy ───────────────────────────────────────────────────────
  # Sits between Traefik and the Docker socket. Fixes API version negotiation issues
  # with Docker 26+ and limits what Traefik can access (security best practice).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: automaton-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    networks:
      - socket-proxy

  # ── Reverse Proxy ────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: automaton-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=automaton-prod"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Let's Encrypt via HTTP-01 challenge
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-certs:/letsencrypt
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - automaton-prod
      - socket-proxy
    depends_on:
      - socket-proxy

  # ── Database ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: automaton-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automaton}
      MYSQL_USER: ${MYSQL_USER:-automaton_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - prod-mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - automaton-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API Blue/Green ────────────────────────────────────────────────────────────
  # Traefik routes api.automaton.monster via the file provider. The generated
  # routes file picks api-blue@docker or api-green@docker as the live backend.
  api-blue:
    <<: *api-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.api-blue.loadbalancer.server.port=8080"

  api-green:
    <<: *api-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.api-green.loadbalancer.server.port=8080"

  # ── Studio (Vue frontend) Blue/Green ──────────────────────────────────────────
  # VITE_ vars are baked into the static build at image-build time.
  # They are not secrets — they are just public URLs.
  # Traefik routes studio.automaton.monster via the generated file-provider config.
  studio-blue:
    <<: *studio-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.studio-blue.loadbalancer.server.port=80"

  studio-green:
    <<: *studio-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.studio-green.loadbalancer.server.port=80"

  # ── Website (marketing/static) Blue/Green ────────────────────────────────────
  # Traefik routes automaton.monster and www.automaton.monster via the generated
  # file-provider config so we can switch traffic without recreating the live color.
  website-blue:
    <<: *website-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.website-blue.loadbalancer.server.port=80"

  website-green:
    <<: *website-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.website-green.loadbalancer.server.port=80"

  website-cli-assets:
    profiles:
      - build-assets
    build:
      context: .
      dockerfile: docker/Dockerfile.website-cli
    image: automaton-website-cli:latest

volumes:
  prod-mysql-data:
  prod-api-appdata:
  prod-api-logs:
  traefik-certs:

networks:
  automaton-prod:
    driver: bridge
  socket-proxy:
    driver: bridge
