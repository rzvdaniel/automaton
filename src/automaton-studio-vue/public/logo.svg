<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="6" y1="6" x2="506" y2="506">
    <stop stop-color="#0F201A"/>
    <stop offset="1" stop-color="#05070A"/>
  </linearGradient>

  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feColorMatrix in="blur" type="matrix"
      values="0 0 0 0 0.262
              0 0 0 0 0.925
              0 0 0 0 0.553
              0 0 0 0.45 0"/>
    <feBlend in="SourceGraphic"/>
  </filter>
</defs>

<rect x="6" y="6" width="500" height="500" rx="118"
      fill="url(#bg)"
      stroke="#43EC8D"
      stroke-width="6"/>

<rect x="24" y="24" width="464" height="464" rx="108"
      stroke="#43EC8D"
      stroke-opacity="0.18"
      stroke-width="2"/>

<g filter="url(#glow)">
  <text x="255"
        y="250"
        fill="#43EC8D"
        font-family="Inter, Arial, sans-serif"
        font-size="260"
        font-weight="800"
        text-anchor="middle"
        dominant-baseline="middle">am</text>
 
</g>
</svg>
