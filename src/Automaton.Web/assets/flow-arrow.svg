<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" fill="none">
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Arrow body -->
  <path d="M0,20 L70,20" stroke="url(#arrowGradient)" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrow head -->
  <path d="M70,20 L85,20 M75,10 L90,20 L75,30" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Data flow dots -->
  <circle cx="20" cy="20" r="2" fill="#06B6D4" opacity="0.6">
    <animate attributeName="cx" from="10" to="70" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>
