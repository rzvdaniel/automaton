<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="60" y1="60" x2="452" y2="452">
    <stop stop-color="#0F201A"/>
    <stop offset="1" stop-color="#05070A"/>
  </linearGradient>

  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feColorMatrix in="blur" type="matrix"
      values="0 0 0 0 0.262
              0 0 0 0 0.925
              0 0 0 0 0.553
              0 0 0 0.45 0"/>
    <feBlend in="SourceGraphic"/>
  </filter>
</defs>

<rect x="48" y="48" width="416" height="416" rx="96"
      fill="url(#bg)"
      stroke="#43EC8D"
      stroke-width="6"/>

<rect x="68" y="68" width="376" height="376" rx="80"
      stroke="#43EC8D"
      stroke-opacity="0.18"
      stroke-width="2"/>

<g filter="url(#glow)">
  <text x="90"
        y="300"
        fill="#43EC8D"
        font-family="Inter, Arial, sans-serif"
        font-size="160"
        font-weight="800">am</text>
  <text x="360"
        y="295"
        fill="#43EC8D"
        font-family="Inter, Arial, sans-serif"
        font-size="100"
        font-weight="800">></text>
</g>
</svg>
