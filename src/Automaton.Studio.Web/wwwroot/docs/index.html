<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automaton Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Comprehensive documentation for the Automaton automation platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-size: 14px;
      --theme-color: #1890ff;
    }
    .sidebar {
      border-right: 1px solid #ebedf0;
    }
    .markdown-section {
      max-width: 80%;
      margin: 0 auto;
    }
    .app-nav {
      margin: 25px 60px 0 0;
      position: absolute;
      right: 0;
      text-align: right;
      z-index: 10;
    }
    /* Fallback styles in case CDN is blocked */
    .app-name-link {
      color: var(--theme-color);
      font-size: 1.5em;
      font-weight: 600;
    }
    .content {
      padding-top: 60px;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'Automaton',
      repo: 'rzvdaniel/automaton',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: 'auto',
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      executeScript: true,
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (html) {
            if (vm.route.file && vm.route.file !== 'README.md') {
              var url = 'https://github.com/rzvdaniel/automaton/blob/main/src/Automaton.Studio.Web/wwwroot/docs/' + vm.route.file;
              var editHtml = '[:memo: Edit Document](' + url + ')\n';
              return html + '\n\n----\n\n' + editHtml;
            }
            return html;
          });
        }
      ]
    };
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy to clipboard plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Zoom image plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- Prism components for syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
