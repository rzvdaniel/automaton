name: Automaton.AllProjects.Tests_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  - main

pr:
  autoCancel: true
  branches:
    include:
      - main

jobs:
- job: AllProjectsTests
  displayName: Run all projects tests
  pool:
    vmImage: 'ubuntu-latest'

  variables:
    automatonAllSolution: './Automaton.All.sln'
    validationConfiguration: 'Debug'

  steps:
  - task: UseDotNet@2
    displayName: ".NET 9.0.318"
    inputs:
      version: '9.0.318'
      packageType: sdk

  - task: DotNetCoreCLI@2
    displayName: "Test all C# projects"
    inputs:
      command: test
      projects: '$(System.DefaultWorkingDirectory)/$(automatonAllSolution)'
      publishTestResults: false
      arguments: '--configuration $(validationConfiguration) --verbosity minimal'
