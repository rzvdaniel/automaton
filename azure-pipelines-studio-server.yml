# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

parameters:
    - name: isRelease
      displayName: Is a release build
      default: false
      type: boolean

jobs:

- job: AutomatonServer
  
  pool:
    vmImage: 'ubuntu-latest'

  variables:
    automatonServerSolution: './Automaton.Server.sln'
    automatonServerProject: './src/Automaton.Api/Automaton.Api.csproj'
    buildPlatform: 'Any CPU'
    buildConfiguration: 'Release'

  steps:
  - task: UseDotNet@2 
    displayName: ".NET 9.x"
    inputs:
      version: '9.x'
      packageType: sdk

  - task: DotNetCoreCLI@2
    displayName: "Test"
    inputs:
      command: test
      projects: '**/$(automatonServerSolution)'
      arguments: '--configuration $(buildConfiguration)'
  
  - task: DotNetCoreCLI@2
    displayName: 'Restore Nuget Packages'
    inputs:
      command: 'restore'
      projects: '$(System.DefaultWorkingDirectory)/$(automatonServerSolution)'
      includeNuGetOrg: true
    
  - task: DotNetCoreCLI@2
    inputs:
      command: 'build'
      projects: '$(System.DefaultWorkingDirectory)/$(automatonServerSolution)'
      arguments: '--no-restore'
    displayName: 'Build projects'

  - task: DotNetCoreCLI@2
    inputs:
      command: 'test'
      projects: '$(System.DefaultWorkingDirectory)/$(automatonServerSolution)'
      arguments: '--no-restore --no-build'
    displayName: 'Run Tests'

  - script: |
      echo "System.DefaultWorkingDirectory=$(System.DefaultWorkingDirectory)"
      echo "Build.ArtifactStagingDirectory=$(Build.ArtifactStagingDirectory)"
      echo "Listing src/Automaton.Api"
      find "$(System.DefaultWorkingDirectory)/src/Automaton.Api" -maxdepth 2 -type f | sort
      echo "Checking appsettings files"
      ls -la "$(System.DefaultWorkingDirectory)/src/Automaton.Api"/appsettings*.json || true
    displayName: 'Diagnose appsettings paths'

  - task: FileTransform@1
    displayName: Transform appsettings
    condition: eq(${{ parameters.isRelease }}, false)
    inputs:
      folderPath: '$(System.DefaultWorkingDirectory)/src/Automaton.Api'
      fileType: 'json'
      targetFiles: 'appsettings.json'

  - task: DotNetCoreCLI@2
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(System.DefaultWorkingDirectory)/src/Automaton.Api/Automaton.Api.csproj'
      arguments: '--configuration $(buildConfiguration) --output "$(build.artifactStagingDirectory)/Automaton.Api" --no-restore'
      zipAfterPublish: false
    displayName: 'Publish Automaton Server'

  - task: PublishPipelineArtifact@1
    displayName: Publish Automaton Server artifact
    inputs:
      targetPath: '$(build.artifactStagingDirectory)/Automaton.Api'
      artifact: 'Automaton.Api'
      publishLocation: 'pipeline'
