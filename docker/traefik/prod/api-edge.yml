http:
  routers:
    api-http-redirect:
      entryPoints:
        - web
      rule: "Host(`__API_DOMAIN__`) || Host(`__STUDIO_DOMAIN__`) || Host(`__WEBSITE_DOMAIN__`) || Host(`www.__WEBSITE_DOMAIN__`) || Host(`__APPS_DOMAIN__`)"
      middlewares:
        - api-redirect
      service: api-blue-edge

    api-edge:
      entryPoints:
        - websecure
      rule: "Host(`__API_DOMAIN__`)"
      service: api-blue-edge
      middlewares:
        - api-https-headers
      tls:
        certResolver: letsencrypt

    studio-edge:
      entryPoints:
        - websecure
      rule: "Host(`__STUDIO_DOMAIN__`)"
      service: studio-__STUDIO_COLOR__-edge
      tls:
        certResolver: letsencrypt

    website-edge:
      entryPoints:
        - websecure
      rule: "Host(`__WEBSITE_DOMAIN__`) || Host(`www.__WEBSITE_DOMAIN__`)"
      service: website-__WEBSITE_COLOR__-edge
      tls:
        certResolver: letsencrypt

  middlewares:
    api-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    api-https-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  services:
    api-blue-edge:
      loadBalancer:
        servers:
          - url: "http://api-__API_COLOR__:8080"
        passHostHeader: true

    studio-__STUDIO_COLOR__-edge:
      loadBalancer:
        servers:
          - url: "http://studio-__STUDIO_COLOR__:80"

    website-__WEBSITE_COLOR__-edge:
      loadBalancer:
        servers:
          - url: "http://website-__WEBSITE_COLOR__:80"

tls:
  options: {}
