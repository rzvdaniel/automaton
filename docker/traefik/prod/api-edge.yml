http:
  routers:
    api-http-redirect:
      entryPoints:
        - web
      rule: "Host(`__API_DOMAIN__`) || Host(`__STUDIO_DOMAIN__`) || Host(`__WEBSITE_DOMAIN__`) || Host(`www.__WEBSITE_DOMAIN__`) || Host(`__APPS_DOMAIN__`) || HostRegexp(`^.+\\.__APPS_DOMAIN__$`)"
      middlewares:
        - api-redirect
      service: api-live-edge

    api-edge:
      entryPoints:
        - websecure
      rule: "Host(`__API_DOMAIN__`)"
      service: api-live-edge
      middlewares:
        - api-https-headers
        - app-security-headers
      tls:
        certResolver: cloudflare

    studio-edge:
      entryPoints:
        - websecure
      rule: "Host(`__STUDIO_DOMAIN__`)"
      service: studio-__STUDIO_COLOR__-edge
      middlewares:
        - security-headers
      tls:
        certResolver: cloudflare

    website-edge:
      entryPoints:
        - websecure
      rule: "Host(`__WEBSITE_DOMAIN__`) || Host(`www.__WEBSITE_DOMAIN__`)"
      service: website-__WEBSITE_COLOR__-edge
      middlewares:
        - website-security-headers
      tls:
        certResolver: cloudflare

    apps-edge:
      entryPoints:
        - websecure
      rule: "Host(`__APPS_DOMAIN__`)"
      service: api-live-edge
      middlewares:
        - api-https-headers
        - app-security-headers
      tls:
        certResolver: cloudflare

    published-apps-wildcard-edge:
      entryPoints:
        - websecure
      rule: "HostRegexp(`^.+\\.__APPS_DOMAIN__$`)"
      priority: 1
      service: api-live-edge
      middlewares:
        - api-https-headers
        - app-security-headers
      tls:
        certResolver: cloudflare

  middlewares:
    api-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    api-https-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://*.__WEBSITE_DOMAIN__ wss://*.__WEBSITE_DOMAIN__ https://*.__APPS_DOMAIN__; frame-src https://*.__WEBSITE_DOMAIN__ https://*.__APPS_DOMAIN__ https://__APPS_DOMAIN__; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'"

    website-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true

    app-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true

  services:
    api-live-edge:
      loadBalancer:
        servers:
          - url: "http://api-__API_COLOR__:8080"
        passHostHeader: true

    studio-__STUDIO_COLOR__-edge:
      loadBalancer:
        servers:
          - url: "http://studio-__STUDIO_COLOR__:80"

    website-__WEBSITE_COLOR__-edge:
      loadBalancer:
        servers:
          - url: "http://website-__WEBSITE_COLOR__:80"

tcp:
  routers:
    runner-broker:
      entryPoints:
        - runner-broker
      rule: "HostSNI(`__API_DOMAIN__`)"
      service: runner-broker
      tls:
        certResolver: cloudflare
  services:
    runner-broker:
      loadBalancer:
        servers:
          - address: "rabbitmq:5672"

tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: cloudflare
        domain:
          main: "__APPS_DOMAIN__"
          sans:
            - "*.__APPS_DOMAIN__"
