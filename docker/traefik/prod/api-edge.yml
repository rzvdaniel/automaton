http:
  routers:
    api-http-redirect:
      entryPoints:
        - web
      rule: "Host(`__API_DOMAIN__`)"
      middlewares:
        - api-redirect
      service: api-blue-edge

    api-edge:
      entryPoints:
        - websecure
      rule: "Host(`__API_DOMAIN__`)"
      service: api-blue-edge
      middlewares:
        - api-https-headers
      tls: {}

    legacy-http-redirect:
      entryPoints:
        - web
      rule: "HostRegexp(`^.+$`)"
      priority: 1
      middlewares:
        - api-redirect
      service: legacy-nginx

    legacy-https:
      entryPoints:
        - websecure
      rule: "HostRegexp(`^.+$`)"
      priority: 1
      service: legacy-nginx
      tls: {}

  middlewares:
    api-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    api-https-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  services:
    api-blue-edge:
      loadBalancer:
        servers:
          - url: "http://api-__API_COLOR__:8080"
        passHostHeader: true

    legacy-nginx:
      loadBalancer:
        servers:
          - url: "https://nginx:443"
        passHostHeader: true
        serversTransport: legacy-nginx-tls

  serversTransports:
    legacy-nginx-tls:
      insecureSkipVerify: true

tls:
  certificates:
    - certFile: "/etc/traefik/certs/fullchain.pem"
      keyFile: "/etc/traefik/certs/privkey.pem"
