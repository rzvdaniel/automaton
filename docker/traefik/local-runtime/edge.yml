http:
  routers:
    local-http-redirect:
      entryPoints: [web]
      rule: "HostRegexp(`^.+$`)"
      middlewares: [local-redirect]
      service: api-live-edge
    local-api:
      entryPoints: [websecure]
      rule: "HostRegexp(`^api\\..+$`)"
      service: api-live-edge
      tls: {}
    local-studio:
      entryPoints: [websecure]
      rule: "HostRegexp(`^studio\\..+$`)"
      service: local-studio
      tls: {}
    local-website:
      entryPoints: [websecure]
      rule: "HostRegexp(`^(?:www\\.)?(?:automaton|website)\\..+$`)"
      service: local-website
      tls: {}
  middlewares:
    local-redirect:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    api-live-edge:
      loadBalancer:
        servers:
          - url: "http://api:8080"
    local-studio:
      loadBalancer:
        servers:
          - url: "http://studio:80"
    local-website:
      loadBalancer:
        servers:
          - url: "http://website:80"
tls:
  certificates:
    - certFile: "/etc/traefik/certs/automaton.test.pem"
      keyFile: "/etc/traefik/certs/automaton.test-key.pem"
