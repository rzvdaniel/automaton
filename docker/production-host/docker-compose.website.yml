# Installed as root by update.sh from the verified release bundle at /usr/local/lib/automaton/docker-compose.website.yml (root:root, mode 644).
# Used only by /usr/local/bin/automaton-deploy-website. It defines website-green alone, so a release tag cannot
# change what the deploy runs: the downloaded source is the build context and nothing else.
name: automaton-prod

services:
  website-green:
    build:
      context: ${AUTOMATON_PRODUCTION_BUILD_CONTEXT:?build context required}
      dockerfile: docker/Dockerfile.website
    image: automaton-prod-website:${AUTOMATON_PRODUCTION_IMAGE_TAG:?image tag required}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - automaton-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  automaton-prod:
    name: automaton-prod_automaton-prod
    external: true
