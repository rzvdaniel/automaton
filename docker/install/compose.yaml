name: automaton-server
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-app: &app
  restart: unless-stopped
  logging: *logging
  environment:
    DOTNET_ENVIRONMENT: Production
    ASPNETCORE_ENVIRONMENT: Production
  volumes:
    - ${CONFIG_DIR:?}/appsettings.Production.json:/app/appsettings.Production.json:ro
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: automaton
      POSTGRES_USER: automaton
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U automaton -d automaton']
      interval: 5s
      timeout: 5s
      retries: 60
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?}
    user: '0:0'
    entrypoint:
      - /bin/sh
      - -ec
      - 'cp /run/secrets/bootstrap.conf /etc/rabbitmq/rabbitmq.conf; chown rabbitmq:rabbitmq /etc/rabbitmq/rabbitmq.conf; exec docker-entrypoint.sh rabbitmq-server'
    restart: unless-stopped
    logging: *logging
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ${CONFIG_DIR:?}/rabbitmq.conf:/run/secrets/bootstrap.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 30
  api:
    <<: *app
    image: ${API_IMAGE:?}
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      # The setup token lives in this root-only file; the API replaces its content when first-admin setup completes.
      Bootstrap__TokenFile: /app/setup-token
    volumes:
      - ${CONFIG_DIR:?}/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ${CONFIG_DIR:?}/secrets/setup-token:/app/setup-token
      - api-data:/app/AppData
      - api-keys:/app/data-protection-keys
      - ${CONFIG_DIR:?}/dynamic:/app/AppData/traefik-dynamic
      - ${CONFIG_DIR:?}/status:/app/installation-status:ro
      - ${BACKUP_DIR:?}/nightly:/app/installation-backups:ro
      - /var/lib/automaton/update/requests:/app/update-requests
      - /var/lib/automaton/backup/requests:/app/backup-requests
      - /var/lib/automaton/update/status:/app/update-status:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
  worker:
    <<: *app
    image: ${WORKER_IMAGE:?}
    volumes:
      - ${CONFIG_DIR:?}/appsettings.Production.json:/app/appsettings.Production.json:ro
      - worker-keys:/app/data-protection-keys
    depends_on:
      api: {condition: service_healthy}
  studio:
    image: ${STUDIO_IMAGE:?}
    volumes:
      - ${CONFIG_DIR:?}/studio-runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: {condition: service_healthy}
  store:
    image: ${STORE_IMAGE:?}
    volumes:
      - ${CONFIG_DIR:?}/store-runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: {condition: service_healthy}
  traefik:
    image: ${TRAEFIK_IMAGE:?}
    restart: unless-stopped
    logging: *logging
    ports: ['80:80', '443:443', '5671:5671']
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_token
      # Used only by the delegated TLS mode (#891): Traefik hands DNS challenges to the responder below.
      HTTPREQ_ENDPOINT: http://acme-responder:8053
      HTTPREQ_USERNAME: acme
      HTTPREQ_PASSWORD: ${ACME_RESPONDER_SECRET:-}
    secrets: [cloudflare_token]
    volumes:
      - ${CONFIG_DIR:?}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${CONFIG_DIR:?}/dynamic:/etc/traefik/dynamic:ro
      - certificates:/certificates
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      retries: 30
  # Delegated TLS mode only (COMPOSE_PROFILES=delegated in .env): answers Let's Encrypt's DNS challenge for
  # _acme-challenge.apps.<domain> and nothing else. Port 53 is published only when this service runs.
  acme-responder:
    profiles: [delegated]
    image: ${RESPONDER_IMAGE:-python:3-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      ACME_RESPONDER_SECRET: ${ACME_RESPONDER_SECRET:-}
    command: [python, -u, /responder.py, --zone, '_acme-challenge.apps.${DOMAIN:-}', --ns-name, 'api.${DOMAIN:-}']
    ports: ['${DNS_BIND:-0.0.0.0}:53:53/udp', '${DNS_BIND:-0.0.0.0}:53:53/tcp']
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes: ['./acme_responder.py:/responder.py:ro']
secrets:
  postgres_password: {file: '${CONFIG_DIR:?}/secrets/postgres-password'}
  cloudflare_token: {file: '${CONFIG_DIR:?}/secrets/cloudflare-token'}
volumes:
  postgres-data:
  rabbitmq-data:
  api-data:
  api-keys:
  worker-keys:
  certificates:
