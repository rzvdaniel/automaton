# Scanners: requests for junk paths that answer 404, and bursts of 404s on Studio, the API root and the store.
# Reads the Traefik JSON access log (keys are alphabetical). Only 404 answers count, so a real page, a published
# app's deep link, a Studio live connection or an upload never matches. Published app hosts only match the junk list.
[Definition]
_junk = (?i:(?:[^"?]*/)?\.(?!well-known(?:/|\?|"))[a-z0-9_-][^"]*|[^"]*(?:wp-(?:admin|login|content|includes|json)|xmlrpc\.php|phpmyadmin|cgi-bin|credentials|/etc/passwd|/actuator|/vendor/phpunit|/boaform|/HNAP1|/manager/html|\.\./|%%2e%%2e)[^"]*|[^"?]*\.(?:php|asp|aspx|jsp|cgi|sql|bak)(?:\?[^"]*)?)
failregex = ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":404,.*"RequestPath":"/<_junk>"
            ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":404,.*"RequestHost":"(?:studio|api|store)\.[^"]*","RequestMethod":"[A-Z]+","RequestPath":"/(?!api/|hubs/|assets/|\.well-known/)[^"]*"
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%SZ"
