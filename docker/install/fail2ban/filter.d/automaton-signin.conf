# Failed Automaton sign-ins: the sign-in endpoint answers 401 for a wrong email or password.
[Definition]
failregex = ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":401,.*"RequestMethod":"POST","RequestPath":"/api/Account/LoginUser(?:\?[^"]*)?"
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%SZ"
ignoreregex =
