# Failed Automaton sign-ins: the sign-in endpoint answers 401 for a wrong email or password, and the API marks a
# rejected API key (401, or 429 once the address used up its failures) with the X-Automaton-Auth-Failure response header.
[Definition]
failregex = ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":401,.*"RequestMethod":"POST","RequestPath":"/api/Account/LoginUser(?:\?[^"]*)?"
            ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":(?:401|429),.*"downstream_X-Automaton-Auth-Failure":"api-key"
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%SZ"
ignoreregex =
