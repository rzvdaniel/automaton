# Failed Automaton sign-ins: the sign-in endpoint answers 401 for a wrong email or password.
# Also a 429 from the API ("too many requests": flooded password resets or invites, or too many wrong API keys from one address;
# the API answers 429 once an address sends more wrong API keys than the limit). Traefik's log has no headers, so these cannot be told apart.
[Definition]
failregex = ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":401,.*"RequestMethod":"POST","RequestPath":"/api/Account/LoginUser(?:\?[^"]*)?"
            ^\{"ClientAddr":"[^"]*","ClientHost":"<HOST>",.*"DownstreamStatus":429,.*"RequestPath":"/api/[^"]*"
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%SZ"
ignoreregex =
