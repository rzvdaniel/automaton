# automaton.monster website and permanent redirects to the separate app store.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # TLS ends at the proxy, so nginx would build http:// Locations; keep redirects relative (#1665).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /llms-full.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /llms/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /templates/ {
        root /usr/share/nginx/ai-guidance;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Pages replaced by the docs rewrite (#1628): old links and search results keep working.
    location = /docs/install-with-ai { return 301 /docs/work-with-ai; }
    location = /docs/install-with-ai.html { return 301 /docs/work-with-ai; }
    location = /docs/getting-started { return 301 /docs/install; }
    location = /docs/getting-started.html { return 301 /docs/install; }
    location = /docs/install-server { return 301 /docs/install; }
    location = /docs/install-server.html { return 301 /docs/install; }
    location = /docs/first-admin { return 301 /docs/install; }
    location = /docs/first-admin.html { return 301 /docs/install; }
    location = /docs/deploy-runner { return 301 /docs/install; }
    location = /docs/deploy-runner.html { return 301 /docs/install; }
    location = /docs/update-server { return 301 /docs/install; }
    location = /docs/update-server.html { return 301 /docs/install; }
    location = /docs/is-automaton-for-you { return 301 /docs/what-is-automaton; }
    location = /docs/is-automaton-for-you.html { return 301 /docs/what-is-automaton; }
    location = /docs/limitations { return 301 /docs/what-is-automaton; }
    location = /docs/limitations.html { return 301 /docs/what-is-automaton; }
    location = /docs/numbers { return 301 /docs/what-is-automaton; }
    location = /docs/numbers.html { return 301 /docs/what-is-automaton; }
    location = /docs/automaton-cli { return 301 /docs/cli; }
    location = /docs/automaton-cli.html { return 301 /docs/cli; }
    location = /docs/deploy { return 301 /docs/cli; }
    location = /docs/deploy.html { return 301 /docs/cli; }
    location = /docs/build-an-automaton-app { return 301 /docs/build-an-app; }
    location = /docs/build-an-automaton-app.html { return 301 /docs/build-an-app; }
    location = /docs/automaton-json { return 301 /docs/build-an-app; }
    location = /docs/automaton-json.html { return 301 /docs/build-an-app; }
    location = /docs/secrets-and-permissions { return 301 /docs/build-an-app; }
    location = /docs/secrets-and-permissions.html { return 301 /docs/build-an-app; }
    location = /docs/apps-repository { return 301 /docs/build-an-app; }
    location = /docs/apps-repository.html { return 301 /docs/build-an-app; }
    location = /docs/troubleshooting { return 301 /docs/when-something-goes-wrong; }
    location = /docs/troubleshooting.html { return 301 /docs/when-something-goes-wrong; }
    location = /docs/faq { return 301 /docs/when-something-goes-wrong; }
    location = /docs/faq.html { return 301 /docs/when-something-goes-wrong; }

    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location = /apps {
        return 301 https://store.automaton.monster/$is_args$args;
    }

    location ^~ /apps/ {
        return 301 https://store.automaton.monster$request_uri;
    }

    location ^~ /creators/ {
        return 301 https://store.automaton.monster$request_uri;
    }

    location = /creators {
        return 301 https://store.automaton.monster$request_uri;
    }

    location ~ ^/(cli|pricing|product|use-cases|catalog|how-setup-works|get-started)/?$ {
        try_files $uri/index.html =404;
    }

    location / {
        error_page 404 /404/index.html;
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
