server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /llms-full.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /llms/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /templates/ {
        root /usr/share/nginx/ai-guidance;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # Scanner probes: dotfiles and server-side script paths answer an empty 404, not the Studio page.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* (?:^/(?:wp-[^/]*|wordpress|phpmyadmin|pma|cgi-bin|xmlrpc|actuator)(?:/|$)|\.(?:php[0-9]?|aspx?|jsp|cgi|env|bak|sql|log|ya?ml|toml|ini|pem|key|sh)$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Studio client routes have no file extension; a missing file with one is a real 404.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }
}
