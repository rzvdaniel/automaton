server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /llms.txt {
        root /usr/share/nginx/ai-guidance;
        add_header Cache-Control "public";
        try_files /llms.txt =404;
    }

    location /llms/ {
        root /usr/share/nginx/ai-guidance;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /templates/ {
        root /usr/share/nginx/ai-guidance;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
