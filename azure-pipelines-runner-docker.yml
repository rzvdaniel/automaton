# Azure Pipeline: Build and Publish Automaton Runner to Docker Hub
#
# This pipeline builds the runner Docker image and publishes it to Docker Hub.
#
# Prerequisites:
#   1. Create a Docker Hub account (e.g., rzvdaniel or automatonhq)
#   2. Create a Docker Hub repository: automaton-runner
#   3. Create a Docker Hub Access Token: https://hub.docker.com/settings/security
#   4. In Azure DevOps, create a Service Connection:
#      - Project Settings > Service Connections > New > Docker Registry
#      - Registry type: Docker Hub
#      - Docker ID: your-docker-hub-username
#      - Password: your-access-token
#      - Service connection name: DockerHub
#
# Trigger: main Runner changes, manually, or on tags (e.g., v1.0.0, runner-v1.0.0)

parameters:
  - name: sourceRef
    displayName: Source ref to build (optional)
    type: string
    default: ''
  - name: expectedSourceRevision
    displayName: Expected source revision (optional)
    type: string
    default: ''

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - 'v*'
      - 'runner-v*'
  paths:
    include:
      - src/Automaton.Runner/**
      - src/Automaton.Core/**
      - src/Automaton.Core.Scripting/**
      - src/Automaton.Steps/**
      - src/Automaton.Mcp/**
      - src/Automaton.Messaging/**
      - system-apps/automaton-infrastructure/actions/**

pr: none  # Don't run on PRs

variables:
  dockerRegistryServiceConnection: 'DockerHub'
  imageRepository: 'rzvdaniel/automaton-runner'
  dockerfilePath: 'src/Automaton.Runner/Dockerfile'
  buildContext: '.'
  
pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push'
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 1

          - script: |
              set -eu
              source_ref="${SOURCE_REF:-}"
              expected_revision="${EXPECTED_SOURCE_REVISION:-}"

              if [[ -n "$source_ref" ]]; then
                case "$source_ref" in
                  refs/heads/*|refs/tags/*) ;;
                  *)
                    echo "Source ref must be a fully-qualified branch or tag ref: $source_ref" >&2
                    exit 1
                    ;;
                esac
                git fetch --no-tags --depth=1 origin "$source_ref"
                git checkout --detach FETCH_HEAD
              fi

              source_revision="$(git rev-parse HEAD)"
              if [[ -n "$expected_revision" && "$expected_revision" != "$source_revision" ]]; then
                echo "Expected source revision $expected_revision but checked out $source_revision." >&2
                exit 1
              fi
              if [[ ! "$source_revision" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Resolved source revision is not a full commit SHA: $source_revision" >&2
                exit 1
              fi

              override=false
              if [[ -n "$source_ref" ]]; then
                override=true
              fi
              echo "Runner pipeline YAML revision: $BUILD_SOURCE_VERSION"
              echo "Runner build source ref: ${source_ref:-$BUILD_SOURCE_BRANCH}"
              echo "Runner build source revision: $source_revision"
              echo "##vso[task.setvariable variable=runnerSourceRevision]$source_revision"
              echo "##vso[task.setvariable variable=commitImageTag]sha-$source_revision"
              echo "##vso[task.setvariable variable=runnerSourceOverride]$override"
            env:
              SOURCE_REF: ${{ parameters.sourceRef }}
              EXPECTED_SOURCE_REVISION: ${{ parameters.expectedSourceRevision }}
              BUILD_SOURCE_VERSION: $(Build.SourceVersion)
              BUILD_SOURCE_BRANCH: $(Build.SourceBranch)
            displayName: 'Validate source revision'

          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(buildContext)
              tags: |
                $(commitImageTag)
              arguments: '--no-cache'

          - script: |
              set -eu
              docker run --rm --entrypoint /bin/sh $(imageRepository):$(commitImageTag) -c 'command -v docker && docker --version'
            displayName: 'Smoke test Docker CLI'

          - script: |
              set -eu
              docker run --rm --entrypoint /bin/sh $(imageRepository):$(commitImageTag) -c '
                for action in restart-hosted-runner delete-hosted-runner; do
                  test -f "/app/SystemApps/automaton-infrastructure/actions/$action/action.yaml" || exit 1
                  test -f "/app/SystemApps/automaton-infrastructure/actions/$action/main.py" || exit 1
                done'
            displayName: 'Smoke test bundled trusted Actions'

          - task: Docker@2
            displayName: 'Push immutable commit image'
            inputs:
              command: push
              repository: $(imageRepository)
              tags: |
                $(commitImageTag)

          - script: |
              set -eu
              image="$(imageRepository):$(commitImageTag)"
              branch="${BUILD_SOURCE_BRANCH:?Build.SourceBranch is required}"

              override="${RUNNER_SOURCE_OVERRIDE:-false}"
              if [[ "$override" == true ]]; then
                echo "Source-ref override build: leaving latest and release aliases unchanged."
                exit 0
              elif [[ "$branch" == refs/tags/* ]]; then
                alias="${branch##*/}"
                alias="${alias#runner-}"
                [[ "$alias" != "" && "$alias" != "latest" && "$alias" != *[!A-Za-z0-9_.-]* ]]
                docker tag "$image" "$(imageRepository):$alias"
                docker tag "$image" "$(imageRepository):latest"
                docker push "$(imageRepository):$alias"
                docker push "$(imageRepository):latest"
              elif [[ "$branch" == refs/heads/main ]]; then
                docker tag "$image" "$(imageRepository):latest"
                docker push "$(imageRepository):latest"
              fi
            env:
              BUILD_SOURCE_BRANCH: $(Build.SourceBranch)
              RUNNER_SOURCE_OVERRIDE: $(runnerSourceOverride)
            displayName: 'Publish release and main aliases'

          - script: |
              set -eu
              image="$(imageRepository):$(commitImageTag)"
              digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image" | sed -n 's/.*@//p')"
              printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
              echo "Runner source revision: $(runnerSourceRevision)"
              echo "Runner immutable image: $image"
              echo "Runner published digest: $digest"
              echo "##vso[task.setvariable variable=runnerPublishedDigest]$digest"
            displayName: 'Record published image digest'

          - task: Docker@2
            displayName: 'Logout from Docker Hub'
            inputs:
              command: logout
              containerRegistry: $(dockerRegistryServiceConnection)

          - script: |
              echo "##[section]Docker Image Published Successfully!"
              echo ""
              echo "Source revision: $(Build.SourceVersion)"
              echo "Immutable image: $(imageRepository):$(commitImageTag)"
              echo "Published digest: $(runnerPublishedDigest)"
              echo "Main and release builds also publish their configured aliases."
              echo ""
              echo "Quick start (recommended):"
              echo ""
              echo "  # 1. Create .env file"
              echo "  cat > .env <<EOF"
              echo "  AUTOMATON_SERVER_URL=https://api.automaton.monster"
              echo "  AUTOMATON_API_KEY=ak_your_key_here"
              echo "  AUTOMATON_RUNNER_NAME=My-Runner"
              echo "  EOF"
              echo ""
              echo "  # 2. Create docker-compose.yml"
              echo "  cat > docker-compose.yml <<EOF"
              echo "  services:"
              echo "    runner:"
              echo "      image: $(imageRepository):latest"
              echo "      container_name: automaton-runner"
              echo "      restart: unless-stopped"
              echo "      env_file: .env"
              echo "      environment:"
              echo "        - RUNNER_SCRIPTS_DIR=/app/data/apps"
              echo "      volumes:"
              echo "        - runner-config:/home/automaton/.config/AutomatonRunner"
              echo "        - runner-logs:/app/logs"
              echo "        - runner-data:/app/data"
              echo "  volumes:"
              echo "    runner-config:"
              echo "    runner-logs:"
              echo "    runner-data:"
              echo "  EOF"
              echo ""
              echo "  # 3. Start"
              echo "  docker compose up -d"
              echo ""
              echo "  # 4. View logs"
              echo "  docker compose logs -f runner"
              echo ""
              echo "See docs/runners/deploying-runner.md for full deployment guide."
            displayName: 'Print Usage Instructions'
