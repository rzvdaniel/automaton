# Azure Pipeline: Build and Publish Automaton Runner to Docker Hub
#
# This pipeline builds the runner Docker image and publishes it to Docker Hub.
#
# Prerequisites:
#   1. Create a Docker Hub account (e.g., rzvdaniel or automatonhq)
#   2. Create a Docker Hub repository: automaton-runner
#   3. Create a Docker Hub Access Token: https://hub.docker.com/settings/security
#   4. In Azure DevOps, create a Service Connection:
#      - Project Settings > Service Connections > New > Docker Registry
#      - Registry type: Docker Hub
#      - Docker ID: your-docker-hub-username
#      - Password: your-access-token
#      - Service connection name: DockerHub
#
# Trigger: main Runner changes, manually, or on tags (e.g., v1.0.0, runner-v1.0.0)

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - 'v*'
      - 'runner-v*'
  paths:
    include:
      - src/Automaton.Runner/**
      - src/Automaton.Core/**
      - src/Automaton.Core.Scripting/**
      - src/Automaton.Steps/**
      - src/Automaton.Mcp/**
      - src/Automaton.Messaging/**
      - system-apps/automaton-infrastructure/actions/**

pr: none  # Don't run on PRs

variables:
  dockerRegistryServiceConnection: 'DockerHub'
  imageRepository: 'rzvdaniel/automaton-runner'
  dockerfilePath: 'src/Automaton.Runner/Dockerfile'
  buildContext: '.'
  
  # Tag with version from git tag, or 'latest' for main branch
  ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
    imageTag: ${{ replace(variables['Build.SourceBranchName'], 'runner-', '') }}
  ${{ else }}:
    imageTag: 'latest'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push'
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(buildContext)
              tags: |
                $(imageTag)
                latest
              arguments: '--no-cache'

          - script: |
              set -eu
              docker run --rm --entrypoint /bin/sh $(imageRepository):$(imageTag) -c 'command -v docker && docker --version'
            displayName: 'Smoke test Docker CLI'

          - script: |
              set -eu
              docker run --rm --entrypoint /bin/sh $(imageRepository):$(imageTag) -c '
                for action in provision-hosted-runner reprovision-hosted-runner restart-hosted-runner suspend-hosted-runner resume-hosted-runner delete-hosted-runner measure-hosted-runner-storage; do
                  test -f "/app/SystemApps/automaton-infrastructure/actions/$action/action.yaml"
                  test -f "/app/SystemApps/automaton-infrastructure/actions/$action/main.py"
                done'
            displayName: 'Smoke test bundled trusted Actions'

          - task: Docker@2
            displayName: 'Push Docker Image'
            inputs:
              command: push
              repository: $(imageRepository)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Logout from Docker Hub'
            inputs:
              command: logout
              containerRegistry: $(dockerRegistryServiceConnection)

          - script: |
              echo "##[section]Docker Image Published Successfully!"
              echo ""
              echo "Image: $(imageRepository):$(imageTag)"
              echo "Image: $(imageRepository):latest"
              echo ""
              echo "Quick start (recommended):"
              echo ""
              echo "  # 1. Create .env file"
              echo "  cat > .env <<EOF"
              echo "  AUTOMATON_SERVER_URL=https://api.automaton.monster"
              echo "  AUTOMATON_API_KEY=ak_your_key_here"
              echo "  AUTOMATON_RUNNER_NAME=My-Runner"
              echo "  EOF"
              echo ""
              echo "  # 2. Create docker-compose.yml"
              echo "  cat > docker-compose.yml <<EOF"
              echo "  services:"
              echo "    runner:"
              echo "      image: $(imageRepository):latest"
              echo "      container_name: automaton-runner"
              echo "      restart: unless-stopped"
              echo "      env_file: .env"
              echo "      environment:"
              echo "        - RUNNER_SCRIPTS_DIR=/app/data/apps"
              echo "      volumes:"
              echo "        - runner-config:/home/automaton/.config/AutomatonRunner"
              echo "        - runner-logs:/app/logs"
              echo "        - runner-data:/app/data"
              echo "  volumes:"
              echo "    runner-config:"
              echo "    runner-logs:"
              echo "    runner-data:"
              echo "  EOF"
              echo ""
              echo "  # 3. Start"
              echo "  docker compose up -d"
              echo ""
              echo "  # 4. View logs"
              echo "  docker compose logs -f runner"
              echo ""
              echo "See docs/runners/deploying-runner.md for full deployment guide."
            displayName: 'Print Usage Instructions'
