<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYTimes Headlines</title>
    <style>
 * {
     margin: 0;
            padding: 0;
   box-sizing: border-box;
      }

    :root {
            --primary-color: #1a1a2e;
          --secondary-color: #16213e;
       --accent-color: #0f3460;
            --highlight-color: #e94560;
   --text-color: #f1f1f1;
 --text-secondary: #a8a8a8;
            --card-bg: #16213e;
  --card-hover: #1f2d47;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
     }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
     background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-color);
        min-height: 100vh;
      padding: 20px;
        }

        .container {
  max-width: 1200px;
            margin: 0 auto;
        }

   /* Header */
        .header {
            text-align: center;
    padding: 40px 20px;
            margin-bottom: 40px;
            background: var(--card-bg);
          border-radius: 15px;
       box-shadow: var(--shadow-lg);
        }

     .header h1 {
    font-size: 3rem;
           font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #fff, var(--highlight-color));
           -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
       background-clip: text;
          }

         .header p {
     font-size: 1.2rem;
            color: var(--text-secondary);
            }

      .header .timestamp {
     font-size: 0.9rem;
                color: var(--text-secondary);
    margin-top: 10px;
         }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
      align-items: center;
          justify-content: center;
   padding: 60px 20px;
        }

        .spinner {
       width: 50px;
            height: 50px;
          border: 4px solid var(--accent-color);
            border-top: 4px solid var(--highlight-color);
            border-radius: 50%;
   animation: spin 1s linear infinite;
      }

        @keyframes spin {
            0% {
  transform: rotate(0deg);
         }

            100% {
            transform: rotate(360deg);
      }
        }

        .loading-text {
    margin-top: 20px;
       font-size: 1.1rem;
   color: var(--text-secondary);
    }

/* Error State */
   .error-container {
 background: var(--card-bg);
  border-left: 4px solid var(--highlight-color);
 padding: 30px;
     border-radius: 10px;
         margin: 20px 0;
            box-shadow: var(--shadow);
        }

 .error-container h2 {
                color: var(--highlight-color);
            margin-bottom: 10px;
 }

         .error-container p {
          color: var(--text-secondary);
        line-height: 1.6;
         }

  .retry-button {
            margin-top: 20px;
       padding: 12px 30px;
            background: var(--highlight-color);
 color: white;
    border: none;
      border-radius: 8px;
            font-size: 1rem;
       cursor: pointer;
     transition: all 0.3s ease;
  }

    .retry-button:hover {
     background: #d93651;
              transform: translateY(-2px);
                box-shadow: var(--shadow-lg);
          }

        /* Headlines Grid */
    .headlines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
            animation: fadeIn 0.6s ease-in;
   }

        @keyframes fadeIn {
          from {
             opacity: 0;
       transform: translateY(20px);
         }

            to {
  opacity: 1;
             transform: translateY(0);
          }
        }

        /* Headline Card */
   .headline-card {
            background: var(--card-bg);
     border-radius: 12px;
            padding: 25px;
       box-shadow: var(--shadow);
        transition: all 0.3s ease;
          cursor: pointer;
  border: 1px solid transparent;
            position: relative;
    overflow: hidden;
        }

            .headline-card::before {
          content: '';
         position: absolute;
         top: 0;
     left: 0;
        width: 100%;
      height: 4px;
            background: linear-gradient(90deg, var(--highlight-color), var(--accent-color));
 transform: scaleX(0);
              transition: transform 0.3s ease;
 }

        .headline-card:hover {
     background: var(--card-hover);
      transform: translateY(-5px);
     box-shadow: var(--shadow-lg);
        border-color: var(--accent-color);
      }

     .headline-card:hover::before {
       transform: scaleX(1);
     }

        .headline-number {
     display: inline-block;
            width: 35px;
            height: 35px;
          background: var(--accent-color);
      color: white;
      border-radius: 50%;
        text-align: center;
     line-height: 35px;
          font-weight: bold;
          margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .headline-title {
            font-size: 1.3rem;
            font-weight: 600;
   line-height: 1.5;
            margin-bottom: 15px;
color: var(--text-color);
        }

.headline-meta {
      display: flex;
            align-items: center;
      gap: 10px;
       color: var(--text-secondary);
            font-size: 0.85rem;
    margin-top: 15px;
            padding-top: 15px;
     border-top: 1px solid var(--accent-color);
      }

 .headline-link {
   color: var(--highlight-color);
      text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
      display: inline-flex;
    align-items: center;
     gap: 5px;
        }

            .headline-link:hover {
    color: #ff6b7a;
     transform: translateX(3px);
      }

     .headline-link::after {
            content: '?';
    font-size: 1.2rem;
       }

        /* Stats Bar */
        .stats-bar {
            background: var(--card-bg);
   border-radius: 10px;
            padding: 20px;
       margin-bottom: 30px;
      display: flex;
    justify-content: space-around;
    align-items: center;
       flex-wrap: wrap;
            gap: 20px;
          box-shadow: var(--shadow);
  }

        .stat-item {
      text-align: center;
        }

        .stat-value {
            font-size: 2rem;
font-weight: bold;
     color: var(--highlight-color);
        }

        .stat-label {
      font-size: 0.9rem;
         color: var(--text-secondary);
            margin-top: 5px;
  }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
      font-size: 2rem;
       }

       .headlines-grid {
      grid-template-columns: 1fr;
   gap: 20px;
      }

            .stats-bar {
        flex-direction: column;
 }
        }

  @media (max-width: 480px) {
    .header {
      padding: 30px 15px;
      }

     .header h1 {
 font-size: 1.75rem;
      }

         .headline-card {
         padding: 20px;
       }

          .headline-title {
    font-size: 1.1rem;
  }
        }

        /* Empty State */
        .empty-state {
     text-align: center;
  padding: 60px 20px;
            background: var(--card-bg);
  border-radius: 15px;
            box-shadow: var(--shadow);
     }

        .empty-state-icon {
    font-size: 4rem;
            margin-bottom: 20px;
 }

        .empty-state h2 {
            font-size: 1.5rem;
margin-bottom: 10px;
        }

        .empty-state p {
 color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
 <div class="header">
  <h1>?? NYTimes Headlines</h1>
            <p>Latest news from The New York Times</p>
   <div class="timestamp" id="lastUpdated"></div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="statsBar" style="display: none;">
 <div class="stat-item">
  <div class="stat-value" id="headlineCount">0</div>
 <div class="stat-label">Headlines</div>
            </div>
     <div class="stat-item">
     <div class="stat-value" id="executionTime">0ms</div>
         <div class="stat-label">Execution Time</div>
         </div>
      <div class="stat-item">
         <div class="stat-value" id="flowStatus">?</div>
     <div class="stat-label">Status</div>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading-container" id="loadingContainer">
            <div class="spinner"></div>
    <div class="loading-text">Fetching latest headlines...</div>
      </div>

        <!-- Error Container -->
        <div class="error-container" id="errorContainer" style="display: none;">
     <h2>?? Unable to Load Headlines</h2>
            <p id="errorMessage">An error occurred while fetching headlines.</p>
        <button class="retry-button" onclick="fetchHeadlines()">Retry</button>
 </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">??</div>
  <h2>No Headlines Available</h2>
    <p>The flow returned no headlines. Please check your configuration.</p>
        </div>

        <!-- Headlines Grid -->
        <div class="headlines-grid" id="headlinesGrid"></div>
    </div>

    <script>
   // ==========================================
        // Configuration
        // ==========================================
   const CONFIG = {
        // ?? YOUR FLOW ID
     flowId: 'c71361c2-a9ff-427e-8eb1-cb4c16c3dbeb',

     // ? Optional: Additional input parameters (if your flow needs them)
       // The API key should be stored in the flow's InputVariables on the backend
            inputs: {
          // Example: max_articles: 10
            },

    // ? Optional: Specify runners (leave null to use first available)
 runnerNames: null  // Or ['Local', 'Production-Runner']
   };

        // ==========================================
      // State Management
        // ==========================================
        let executionStartTime = 0;

      // ==========================================
        // Main Function - Fetch Headlines
  // ==========================================
        async function fetchHeadlines() {
            executionStartTime = Date.now();

   // Show loading state
     showElement('loadingContainer');
            hideElement('errorContainer');
            hideElement('emptyState');
  hideElement('statsBar');
            document.getElementById('headlinesGrid').innerHTML = '';

            try {
      console.log('?? Fetching headlines from flow:', CONFIG.flowId);

          // ? OPTION 1: Use Automaton SDK (Recommended)
      if (window.Automaton && window.Automaton.executeFlow) {
           console.log('?? Using Automaton SDK');
const result = await window.Automaton.executeFlow(
     CONFIG.flowId,
                CONFIG.inputs,
        CONFIG.runnerNames
         );

     handleFlowResult(result);
     } else {
     // ? OPTION 2: Direct HTTP call (Fallback)
         console.log('?? SDK not available, using direct HTTP call');
         await fetchHeadlinesDirectHTTP();
        }

   } catch (error) {
console.error('? Error fetching headlines:', error);
         hideElement('loadingContainer');
    showError(error.message);
            }
      }

        // ==========================================
        // Direct HTTP Method (Fallback)
        // ==========================================
     async function fetchHeadlinesDirectHTTP() {
            // Check if appId is available (set by WebAppViewer)
            const appId = window.Automaton?.appId;

  if (!appId) {
   throw new Error('App ID not available. This app must be accessed through Automaton platform.');
            }

console.log('?? Request: POST /api/web-apps/{appId}/flows/{flowId}/execute');

            const response = await fetch(`/api/web-apps/${appId}/flows/${CONFIG.flowId}/execute`, {
     method: 'POST',
         headers: {
          'Content-Type': 'application/json'
             },
           body: JSON.stringify({
      inputs: CONFIG.inputs || {},
         runnerNames: CONFIG.runnerNames
           })
            });

            console.log('?? Response status:', response.status);

   if (!response.ok) {
        const errorData = await response.json().catch(() => null);
            throw new Error(errorData?.message || `HTTP ${response.status}: ${response.statusText}`);
     }

         const result = await response.json();
      console.log('? Flow executed successfully:', result);

            handleFlowResult(result);
        }

        // ==========================================
        // Handle Flow Result
        // ==========================================
      function handleFlowResult(data) {
   // Calculate execution time
            const executionTime = Date.now() - executionStartTime;

    // Hide loading
          hideElement('loadingContainer');

       // Check if flow was successful
      if (!data.success) {
           throw new Error(data.message || 'Flow execution failed');
   }

    // Extract headlines from OutputVariables
            // ? Adjust property name based on your flow's output
            const headlines = data.outputVariables?.headlines
        || data.outputVariables?.result
   || data.outputVariables?.articles
  || [];

            console.log('?? Headlines received:', headlines?.length || 0);

          // Update stats
     updateStats(headlines.length, executionTime, data.status);

// Display headlines
   if (headlines && headlines.length > 0) {
displayHeadlines(headlines);
            } else {
              showElement('emptyState');
   }

  // Update last updated timestamp
          updateTimestamp();
        }

        // ==========================================
 // Display Functions
        // ==========================================
        function displayHeadlines(headlines) {
            const grid = document.getElementById('headlinesGrid');
  grid.innerHTML = '';

            headlines.forEach((headline, index) => {
   const card = createHeadlineCard(headline, index + 1);
   grid.appendChild(card);
      });

            // Animate cards in
            const cards = grid.querySelectorAll('.headline-card');
      cards.forEach((card, index) => {
       setTimeout(() => {
              card.style.animation = 'fadeIn 0.5s ease-in';
   }, index * 50);
    });
        }

        function createHeadlineCard(headline, number) {
            const card = document.createElement('div');
  card.className = 'headline-card';

            // Handle different data structures
            const title = headline.title || headline.Title || headline.headline || 'Untitled';
    const url = headline.url || headline.Url || headline.link || '#';

         card.innerHTML = `
<div class="headline-number">${number}</div>
     <div class="headline-title">${escapeHtml(title)}</div>
 <div class="headline-meta">
      <a href="${escapeHtml(url)}" target="_blank" class="headline-link">
          Read Full Article
    </a>
     </div>
       `;

            // Add click handler for the entire card
          card.addEventListener('click', (e) => {
 if (e.target.tagName !== 'A') {
         window.open(url, '_blank');
                }
 });

          return card;
    }

        function updateStats(count, executionTime, status) {
       document.getElementById('headlineCount').textContent = count;
      document.getElementById('executionTime').textContent = `${executionTime}ms`;

     const statusIcon = status === 'Success' ? '?' : '??';
            document.getElementById('flowStatus').textContent = statusIcon;

            showElement('statsBar');
        }

        function updateTimestamp() {
     const now = new Date();
            const options = {
            hour: '2-digit',
          minute: '2-digit',
     second: '2-digit',
    month: 'short',
           day: 'numeric'
         };
            const timestamp = now.toLocaleString('en-US', options);
  document.getElementById('lastUpdated').textContent = `Last updated: ${timestamp}`;
 }

        function showError(message) {
      document.getElementById('errorMessage').textContent = message;
         showElement('errorContainer');
        }

    // ==========================================
        // Utility Functions
        // ==========================================
        function showElement(id) {
            const element = document.getElementById(id);
if (element) element.style.display = 'block';
      }

        function hideElement(id) {
            const element = document.getElementById(id);
       if (element) element.style.display = 'none';
        }

        function escapeHtml(text) {
       const div = document.createElement('div');
div.textContent = text;
   return div.innerHTML;
      }

        // ==========================================
   // Initialization
        // ==========================================
   // Fetch headlines when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('?? Page loaded, fetching headlines...');

  // Check if Automaton SDK is available
  if (window.Automaton) {
       console.log('? Automaton SDK detected');
    console.log('?? App ID:', window.Automaton.appId);
    } else {
      console.warn('?? Automaton SDK not loaded - falling back to direct HTTP');
            }

            fetchHeadlines();
        });

// Optional: Auto-refresh every 5 minutes
      // setInterval(fetchHeadlines, 5 * 60 * 1000);
    </script>
</body>
</html>
