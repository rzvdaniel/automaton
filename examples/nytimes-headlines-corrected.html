<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NYTimes Headlines</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 10px 0; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #status { color: #666; }
    #error { color: red; display: none; }
  </style>
</head>
<body>
  <h1>NYTimes Headlines</h1>
  <div id="status">Loading...</div>
  <div id="error"></div>
  <ul id="headlines"></ul>
  <button onclick="load()">Reload</button>

  <!-- automatonApi.js is automatically available from parent window -->
  <script>
    const flowIdentifier = 'Headlines4';
    const inputs = {};

    async function load() {
      const status = document.getElementById('status');
      const error = document.getElementById('error');
      const list = document.getElementById('headlines');
      
      status.textContent = 'Loading...';
      error.style.display = 'none';
      list.innerHTML = '';

      try {
        // ? USE automatonApi.executeFlow() instead of fetch()
        // This goes through the parent window's secure proxy
        // and automatically includes JWT token if user is authenticated
        const data = await automatonApi.executeFlow(flowIdentifier, {
          inputs: inputs,
          // Optional: specify runner names
          // runnerNames: ['my-runner']
        });

        if (!data.success) {
          throw new Error(data.message || 'Flow execution failed');
        }

        let headlines = data.outputVariables?.headlines || [];

        // Parse if it's a JSON string
        if (typeof headlines === 'string') {
          headlines = JSON.parse(headlines);
        }

        // Ensure it's an array
        if (!Array.isArray(headlines)) {
          headlines = [headlines];
        }

        // Display headlines
        headlines.forEach(h => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = h.url || '#';
          a.target = '_blank';
          a.textContent = h.title || 'No title';
          li.appendChild(a);
          list.appendChild(li);
        });

        status.textContent = `Loaded ${headlines.length} headlines.`;
      } catch (e) {
        error.textContent = e.message;
        error.style.display = 'block';
        status.textContent = '';
        console.error('Error loading headlines:', e);
      }
    }

    // Load headlines when page loads
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
