name: automaton-runtime-local

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-local-env: &runtime-local-env
  LOCAL_RUNTIME_API_DOMAIN: ${LOCAL_RUNTIME_API_DOMAIN:-api.automaton.test}
  LOCAL_RUNTIME_STUDIO_DOMAIN: ${LOCAL_RUNTIME_STUDIO_DOMAIN:-studio.automaton.test}
  LOCAL_RUNTIME_APPS_DOMAIN: ${LOCAL_RUNTIME_APPS_DOMAIN:-apps.automaton.test}
  LOCAL_RUNTIME_WEBSITE_DOMAIN: ${LOCAL_RUNTIME_WEBSITE_DOMAIN:-website.automaton.test}
  LOCAL_RUNTIME_HTTPS_PORT: ${LOCAL_RUNTIME_HTTPS_PORT:-8443}
  LOCAL_RUNTIME_CERT_FILE: ${LOCAL_RUNTIME_CERT_FILE:-automaton.test.pem}
  LOCAL_RUNTIME_CERT_KEY_FILE: ${LOCAL_RUNTIME_CERT_KEY_FILE:-automaton.test-key.pem}
  LOCAL_RUNTIME_PROXY_AUTH_KEY: ${LOCAL_RUNTIME_PROXY_AUTH_KEY:-local-runtime-secret}

services:
  traefik:
    image: traefik:v3.1
    container_name: automaton-runtime-local-traefik
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LOCAL_RUNTIME_HTTP_PORT:-8080}:80"
      - "${LOCAL_RUNTIME_HTTPS_PORT:-8443}:443"
      - "${LOCAL_RUNTIME_TRAEFIK_PING_PORT:-8082}:8082"
    volumes:
      - ./docker/traefik/local-managed/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${LOCAL_RUNTIME_CERTS_DIR:-./.local-runtime/certs}:/etc/traefik/certs:ro
      - ${LOCAL_RUNTIME_TRAEFIK_DYNAMIC_ROOT:-./.local-runtime/traefik-dynamic}:/etc/traefik/dynamic:ro
    networks:
      automaton-runtime-local:
      automaton-runtime-local-runner:
        aliases:
          - traefik
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8082/ping | grep -q OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: automaton-runtime-local-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_RUNTIME_MYSQL_ROOT_PASSWORD:-AutomatonRoot123!}
      MYSQL_DATABASE: ${LOCAL_RUNTIME_MYSQL_DATABASE:-automaton}
      MYSQL_USER: ${LOCAL_RUNTIME_MYSQL_USER:-automaton_user}
      MYSQL_PASSWORD: ${LOCAL_RUNTIME_MYSQL_PASSWORD:-AutomatonPass123!}
    ports:
      - "${LOCAL_RUNTIME_MYSQL_PORT:-3311}:3306"
    volumes:
      - runtime-local-mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - automaton-runtime-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${LOCAL_RUNTIME_MYSQL_ROOT_PASSWORD:-AutomatonRoot123!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: automaton-runtime-local-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${LOCAL_RUNTIME_RABBITMQ_USER:-automaton}
      RABBITMQ_DEFAULT_PASS: ${LOCAL_RUNTIME_RABBITMQ_PASSWORD:-automaton}
    ports:
      - "${LOCAL_RUNTIME_RABBITMQ_PORT:-5672}:5672"
      - "${LOCAL_RUNTIME_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - runtime-local-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - automaton-runtime-local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: automaton-runtime-local-smtp4dev
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LOCAL_RUNTIME_SMTP4DEV_WEB_PORT:-3001}:80"
      - "${LOCAL_RUNTIME_SMTP4DEV_SMTP_PORT:-2526}:25"
    networks:
      - automaton-runtime-local

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: automaton-runtime-local-api:latest
    container_name: automaton-runtime-local-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MySqlConnection: Server=mysql;Port=3306;Database=${LOCAL_RUNTIME_MYSQL_DATABASE:-automaton};User=${LOCAL_RUNTIME_MYSQL_USER:-automaton_user};Password=${LOCAL_RUNTIME_MYSQL_PASSWORD:-AutomatonPass123!};
      Cors__AllowedOrigins__0: https://${LOCAL_RUNTIME_STUDIO_DOMAIN:-studio.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      Cors__AllowedOrigins__1: https://${LOCAL_RUNTIME_WEBSITE_DOMAIN:-website.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      JwtOptions__Issuer: https://${LOCAL_RUNTIME_API_DOMAIN:-api.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      AppConfig__WebsiteUrl: https://${LOCAL_RUNTIME_WEBSITE_DOMAIN:-website.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${LOCAL_RUNTIME_RABBITMQ_USER:-automaton}
      RabbitMq__Password: ${LOCAL_RUNTIME_RABBITMQ_PASSWORD:-automaton}
      EmailConfig__EmailHost: smtp4dev
      EmailConfig__EmailPort: 25
      EmailConfig__EmailUseSsl: "false"
      EmailConfig__SendEmailsInDevelopment: "true"
      GitHub__FrontendUrl: https://${LOCAL_RUNTIME_STUDIO_DOMAIN:-studio.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      CloudflareTurnstile__Enabled: "false"
      PublishedApps__PublicBaseUrl: https://${LOCAL_RUNTIME_APPS_DOMAIN:-apps.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      PublishedApps__ApiBaseUrl: https://${LOCAL_RUNTIME_API_DOMAIN:-api.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      PublishedApps__RuntimeProxyAuthKey: ${LOCAL_RUNTIME_PROXY_AUTH_KEY:-local-runtime-secret}
      PublishedApps__TraefikDynamicConfigRoot: /app/AppData/traefik-dynamic
      HostedRunners__Enabled: "true"
      HostedRunners__ServerUrl: http://api:8080
      HostedRunners__DockerImage: automaton-runtime-local-runner:latest
      HostedRunners__DockerNetwork: automaton-runtime-local-runner
      HostedRunners__RuntimeDockerNetwork: automaton-runtime-local-runner
      HostedRunners__AutoCreateLocalRunnerHost: "true"
      HostedRunners__LocalRunnerHostName: runtime-local-docker
      # These values are scheduler capacity budgets for the auto-seeded local RunnerHost.
      # They are not auto-detected hardware specs.
      HostedRunners__LocalRunnerHostCpuCores: "8"
      HostedRunners__LocalRunnerHostMemoryMb: "16384"
      HostedRunners__LocalRunnerHostDiskMb: "65536"
    volumes:
      - runtime-local-api-appdata:/app/AppData
      - runtime-local-published-apps:/app/AppData/published-apps
      - ${LOCAL_RUNTIME_TRAEFIK_DYNAMIC_ROOT:-./.local-runtime/traefik-dynamic}:/app/AppData/traefik-dynamic
      - runtime-local-api-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - automaton-runtime-local
      - automaton-runtime-local-runner
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: automaton-runtime-local-worker:latest
    container_name: automaton-runtime-local-worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__MySqlConnection: Server=mysql;Port=3306;Database=${LOCAL_RUNTIME_MYSQL_DATABASE:-automaton};User=${LOCAL_RUNTIME_MYSQL_USER:-automaton_user};Password=${LOCAL_RUNTIME_MYSQL_PASSWORD:-AutomatonPass123!};
      AppConfig__WebsiteUrl: https://${LOCAL_RUNTIME_WEBSITE_DOMAIN:-website.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
      AppConfig__ApiUrl: http://api:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${LOCAL_RUNTIME_RABBITMQ_USER:-automaton}
      RabbitMq__Password: ${LOCAL_RUNTIME_RABBITMQ_PASSWORD:-automaton}
      EmailConfig__EmailHost: smtp4dev
      EmailConfig__EmailPort: 25
      EmailConfig__EmailUseSsl: "false"
      EmailConfig__SendEmailsInDevelopment: "true"
      Logging__File__Path: /app/logs
      HostedRunners__Enabled: "true"
      HostedRunners__ServerUrl: http://api:8080
      HostedRunners__DockerImage: automaton-runtime-local-runner:latest
      HostedRunners__DockerNetwork: automaton-runtime-local-runner
      HostedRunners__RuntimeDockerNetwork: automaton-runtime-local-runner
    volumes:
      - runtime-local-worker-logs:/app/logs
      - runtime-local-worker-dataprotection:/app/data-protection-keys
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - automaton-runtime-local
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      smtp4dev:
        condition: service_started

  studio:
    build:
      context: .
      dockerfile: docker/Dockerfile.studio
      args:
        VITE_API_BASE_URL: https://${LOCAL_RUNTIME_API_DOMAIN:-api.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
        VITE_GITHUB_AUTH_API_BASE_URL: https://${LOCAL_RUNTIME_API_DOMAIN:-api.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
        VITE_PUBLIC_APPS_BASE_URL: https://${LOCAL_RUNTIME_APPS_DOMAIN:-apps.automaton.test}:${LOCAL_RUNTIME_HTTPS_PORT:-8443}
        VITE_APP_TITLE: Automaton Studio (Runtime Local)
        VITE_ENABLE_MOCK_API: "false"
        VITE_SUBSCRIPTIONS_ENABLED: "true"
    image: automaton-runtime-local-studio:latest
    container_name: automaton-runtime-local-studio
    restart: unless-stopped
    logging: *default-logging
    networks:
      - automaton-runtime-local
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  website:
    build:
      context: .
      dockerfile: docker/Dockerfile.website
    image: automaton-runtime-local-website:latest
    container_name: automaton-runtime-local-website
    restart: unless-stopped
    logging: *default-logging
    networks:
      - automaton-runtime-local
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  runner:
    profiles: ["runner"]
    build:
      context: ./src
      dockerfile: Automaton.Runner/Dockerfile
    image: automaton-runtime-local-runner:latest
    container_name: automaton-runtime-local-runner
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOTNET_ENVIRONMENT: Development
      AUTOMATON_SERVER_URL: http://api:8080
      AUTOMATON_API_KEY: ${LOCAL_RUNTIME_AUTOMATON_API_KEY:-${AUTOMATON_API_KEY:-}}
      AUTOMATON_RUNNER_NAME: ${LOCAL_RUNTIME_AUTOMATON_RUNNER_NAME:-local-runtime-runner}
      AUTOMATON_WORKSPACE_ROOT: /automaton/workspace
      RUNNER_SCRIPTS_DIR: /automaton/workspace/apps
    volumes:
      - runtime-local-runner-config:/app/config
      - runtime-local-runner-logs:/app/logs
      - runtime-local-runner-workspace:/automaton/workspace
    networks:
      - automaton-runtime-local-runner
    depends_on:
      api:
        condition: service_healthy

volumes:
  runtime-local-mysql-data:
  runtime-local-rabbitmq-data:
  runtime-local-api-appdata:
  runtime-local-published-apps:
  runtime-local-api-logs:
  runtime-local-worker-logs:
  runtime-local-worker-dataprotection:
  runtime-local-runner-config:
  runtime-local-runner-logs:
  runtime-local-runner-workspace:

networks:
  automaton-runtime-local:
    name: automaton-runtime-local
    driver: bridge
  automaton-runtime-local-runner:
    name: automaton-runtime-local-runner
    driver: bridge
    internal: true
