name: Build and Release Automaton Runner Console

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

env:
  PROJECT_NAME: automaton-runner
  PROJECT_PATH: src/Automaton.Runner.Console

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.type }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Framework-Dependent builds
          - os: ubuntu-latest
            platform: win-x64
            type: framework-dependent
            artifact_name: automaton-runner-windows-x64
            file_extension: zip
          - os: ubuntu-latest
            platform: linux-x64
            type: framework-dependent
            artifact_name: automaton-runner-linux-x64
            file_extension: tar.gz
          - os: ubuntu-latest
            platform: linux-arm64
            type: framework-dependent
            artifact_name: automaton-runner-linux-arm64
            file_extension: tar.gz
          - os: ubuntu-latest
            platform: osx-x64
            type: framework-dependent
            artifact_name: automaton-runner-macos-x64
            file_extension: tar.gz
          - os: ubuntu-latest
            platform: osx-arm64
            type: framework-dependent
            artifact_name: automaton-runner-macos-arm64
            file_extension: tar.gz
            
          # Self-Contained builds
          - os: ubuntu-latest
            platform: win-x64
            type: self-contained
            artifact_name: automaton-runner-standalone-windows-x64
            file_extension: zip
          - os: ubuntu-latest
            platform: linux-x64
            type: self-contained
            artifact_name: automaton-runner-standalone-linux-x64
            file_extension: tar.gz
          - os: ubuntu-latest
            platform: linux-arm64
            type: self-contained
            artifact_name: automaton-runner-standalone-linux-arm64
            file_extension: tar.gz
          - os: ubuntu-latest
            platform: osx-x64
            type: self-contained
            artifact_name: automaton-runner-standalone-macos-x64
            file_extension: tar.gz
          - os: ubuntu-latest
            platform: osx-arm64
            type: self-contained
            artifact_name: automaton-runner-standalone-macos-arm64
            file_extension: tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Update project version
      run: |
        sed -i 's/<Version>.*<\/Version>/<Version>${{ steps.version.outputs.version }}<\/Version>/' ${{ env.PROJECT_PATH }}/Automaton.Runner.Console.csproj
        sed -i 's/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>${{ steps.version.outputs.version }}.0<\/AssemblyVersion>/' ${{ env.PROJECT_PATH }}/Automaton.Runner.Console.csproj
        sed -i 's/<FileVersion>.*<\/FileVersion>/<FileVersion>${{ steps.version.outputs.version }}.0<\/FileVersion>/' ${{ env.PROJECT_PATH }}/Automaton.Runner.Console.csproj

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build (Framework-Dependent)
      if: matrix.type == 'framework-dependent'
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          --configuration Release-FrameworkDependent \
          --runtime ${{ matrix.platform }} \
          --self-contained false \
          --output ./build/${{ matrix.platform }} \
          --verbosity minimal

    - name: Build (Self-Contained)
      if: matrix.type == 'self-contained'
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          --configuration Release-SelfContained \
          --runtime ${{ matrix.platform }} \
          --self-contained true \
          --output ./build/${{ matrix.platform }} \
          --verbosity minimal

    - name: Copy additional files
      run: |
        cp ${{ env.PROJECT_PATH }}/appsettings.json ./build/${{ matrix.platform }}/
        cp README.md ./build/${{ matrix.platform }}/
        cp INSTALLATION.md ./build/${{ matrix.platform }}/
        
        # Create a simple usage file
        cat > ./build/${{ matrix.platform }}/USAGE.txt << 'EOF'
        Automaton Runner Console - Quick Start
        =====================================
        
        1. First time setup:
           ./automaton-runner auth --api-key YOUR_API_KEY --server https://your-server.com
           ./automaton-runner register --name "My-Runner"
        
        2. Run the runner:
           ./automaton-runner run --name "My-Runner"
        
        3. Alternative with environment variables:
           export AUTOMATON_API_KEY="YOUR_API_KEY"
           ./automaton-runner run --name "My-Runner" --server https://your-server.com
        
        For full documentation, see INSTALLATION.md or visit:
        https://docs.automaton.com/runner-console
        EOF

    - name: Create ZIP package (Windows)
      if: matrix.file_extension == 'zip'
      run: |
        cd ./build/${{ matrix.platform }}
        zip -r ../../${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.zip *

    - name: Create TAR.GZ package (Linux/macOS)
      if: matrix.file_extension == 'tar.gz'
      run: |
        cd ./build/${{ matrix.platform }}
        tar -czf ../../${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.tar.gz *

    - name: Generate checksums
      run: |
        if [ -f "${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.zip" ]; then
          sha256sum "${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.zip" > "${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.zip.sha256"
        fi
        if [ -f "${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.tar.gz" ]; then
          sha256sum "${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.tar.gz" > "${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.tar.gz.sha256"
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}
        path: |
          ${{ matrix.artifact_name }}-v${{ steps.version.outputs.version }}.*
        retention-days: 7

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Prepare release files
      run: |
        mkdir -p ./release-files
        find ./artifacts -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" | xargs -I {} cp {} ./release-files/
        
        # Create combined checksum file
        cd ./release-files
        cat *.sha256 > checksums.sha256
        
        # List all files
        echo "Release files:"
        ls -la

    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << EOF
        # Automaton Runner Console v${{ steps.version.outputs.version }}
        
        Cross-platform command-line runner for the Automaton workflow automation system.
        
        ## ?? Quick Start
        
        ### Framework-Dependent (Recommended - ~15MB)
        Requires .NET 8 Runtime installed on the target system.
        
        **Windows:**
        \`\`\`powershell
        # Install .NET 8 Runtime first
        winget install Microsoft.DotNet.Runtime.8
        
        # Download and run
        Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/automaton-runner-windows-x64-v${{ steps.version.outputs.version }}.zip" -OutFile "automaton-runner.zip"
        Expand-Archive -Path "automaton-runner.zip" -DestinationPath "automaton-runner"
        cd automaton-runner
        .\automaton-runner.exe --help
        \`\`\`
        
        **Linux:**
        \`\`\`bash
        # Install .NET 8 Runtime first
        sudo apt install dotnet-runtime-8.0
        
        # Download and run
        wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/automaton-runner-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
        tar -xzf automaton-runner-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
        ./automaton-runner --help
        \`\`\`
        
        ### Self-Contained (Zero Dependencies - ~65MB)
        No .NET Runtime required. Works on air-gapped systems.
        
        **Windows:**
        \`\`\`powershell
        Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/automaton-runner-standalone-windows-x64-v${{ steps.version.outputs.version }}.zip" -OutFile "automaton-runner.zip"
        Expand-Archive -Path "automaton-runner.zip" -DestinationPath "automaton-runner"
        cd automaton-runner
        .\automaton-runner.exe --help
        \`\`\`
        
        **Linux:**
        \`\`\`bash
        wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/automaton-runner-standalone-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
        tar -xzf automaton-runner-standalone-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
        ./automaton-runner --help
        \`\`\`
        
        ## ?? Available Downloads
        
        ### Framework-Dependent (requires .NET 8 Runtime)
        | Platform | Architecture | Download | Size |
        |----------|-------------|----------|------|
        | Windows | x64 | [automaton-runner-windows-x64-v${{ steps.version.outputs.version }}.zip] | ~15MB |
        | Linux | x64 | [automaton-runner-linux-x64-v${{ steps.version.outputs.version }}.tar.gz] | ~15MB |
        | Linux | ARM64 | [automaton-runner-linux-arm64-v${{ steps.version.outputs.version }}.tar.gz] | ~15MB |
        | macOS | x64 | [automaton-runner-macos-x64-v${{ steps.version.outputs.version }}.tar.gz] | ~15MB |
        | macOS | ARM64 | [automaton-runner-macos-arm64-v${{ steps.version.outputs.version }}.tar.gz] | ~15MB |
        
        ### Self-Contained (no dependencies)
        | Platform | Architecture | Download | Size |
        |----------|-------------|----------|------|
        | Windows | x64 | [automaton-runner-standalone-windows-x64-v${{ steps.version.outputs.version }}.zip] | ~65MB |
        | Linux | x64 | [automaton-runner-standalone-linux-x64-v${{ steps.version.outputs.version }}.tar.gz] | ~65MB |
        | Linux | ARM64 | [automaton-runner-standalone-linux-arm64-v${{ steps.version.outputs.version }}.tar.gz] | ~60MB |
        | macOS | x64 | [automaton-runner-standalone-macos-x64-v${{ steps.version.outputs.version }}.tar.gz] | ~60MB |
        | macOS | ARM64 | [automaton-runner-standalone-macos-arm64-v${{ steps.version.outputs.version }}.tar.gz] | ~60MB |
        
        ## ?? Installation & Usage
        
        See [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/main/INSTALLATION.md) for detailed installation instructions and deployment scenarios.
        
        ## ? Features
        
        - ?? **Cross-platform**: Windows, Linux, and macOS support
        - ?? **API Key Authentication**: Secure, automation-friendly
        - ?? **Zero Dependencies**: Self-contained option available  
        - ?? **Production Ready**: Service/daemon installation support
        - ?? **Docker Support**: Container-ready
        - ?? **Real-time Execution**: SignalR-based workflow execution
        - ?? **Auto-reconnection**: Handles network interruptions
        
        ## ?? Verification
        
        All packages include SHA256 checksums for verification:
        - Download \`checksums.sha256\` to verify package integrity
        - Individual checksum files are also available for each package
        
        ## ?? Documentation
        
        - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/INSTALLATION.md)
        - [README](https://github.com/${{ github.repository }}/blob/main/src/Automaton.Runner.Console/README.md)
        - [API Documentation](https://docs.automaton.com)
        
        ## ?? Docker
        
        Docker images are also available:
        \`\`\`bash
        docker pull your-registry/automaton-runner:v${{ steps.version.outputs.version }}
        \`\`\`
        
        ---
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.previous }}...v${{ steps.version.outputs.version }}
        EOF

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Automaton Runner Console v${{ steps.version.outputs.version }}
        body_path: release_notes.md
        files: ./release-files/*
        prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        make_latest: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update latest tag
      if: github.event.inputs.prerelease != 'true'
      run: |
        git tag -f latest
        git push -f origin latest

  build-docker:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download Linux x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: automaton-runner-standalone-linux-x64-v${{ steps.version.outputs.version }}
        path: ./docker-build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract and prepare Docker build
      run: |
        cd docker-build
        tar -xzf automaton-runner-standalone-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
        rm *.tar.gz
        
        # Create optimized Dockerfile for self-contained build
        cat > Dockerfile << 'EOF'
        FROM mcr.microsoft.com/dotnet/runtime-deps:8.0-alpine AS base
        
        # Install curl for health checks (optional)
        RUN apk add --no-cache curl
        
        # Create app directory
        WORKDIR /app
        
        # Copy the self-contained application
        COPY . .
        
        # Create non-root user for security
        RUN addgroup -g 1001 automaton && \
            adduser -u 1001 -G automaton -s /bin/sh -D automaton && \
            chown -R automaton:automaton /app && \
            chmod +x /app/automaton-runner
        
        # Switch to non-root user
        USER automaton
        
        # Set environment variables
        ENV DOTNET_ENVIRONMENT=Production
        ENV AppConfig__BaseUrl=https://localhost:7064
        
        # Health check
        HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD ./automaton-runner status || exit 1
        
        # Set the entry point
        ENTRYPOINT ["./automaton-runner"]
        
        # Default command shows help
        CMD ["--help"]
        EOF

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./docker-build
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/automaton-runner:v${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/automaton-runner:latest
        labels: |
          org.opencontainers.image.title=Automaton Runner Console
          org.opencontainers.image.description=Cross-platform command-line runner for Automaton workflow automation
          org.opencontainers.image.version=v${{ steps.version.outputs.version }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  notify-success:
    name: Notify Success
    needs: [create-release, build-docker]
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success'
    
    steps:
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Summary
      run: |
        echo "## ?? Release v${{ steps.version.outputs.version }} completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ?? Available Downloads:" >> $GITHUB_STEP_SUMMARY
        echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
        echo "- [Docker Image](https://ghcr.io/${{ github.repository_owner }}/automaton-runner:v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ?? Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Test the release on target platforms" >> $GITHUB_STEP_SUMMARY
        echo "2. Update documentation if needed" >> $GITHUB_STEP_SUMMARY
        echo "3. Announce the release to users" >> $GITHUB_STEP_SUMMARY
        echo "4. Update download links on your website" >> $GITHUB_STEP_SUMMARY