name: Build native Runner archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Native Runner version, e.g. 1.0.0'
        required: true
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64]
        self-contained: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build the native Runner
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          SELF_CONTAINED: ${{ matrix.self-contained }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]
          dotnet publish src/Automaton.Runner/Automaton.Runner.csproj -c Release --runtime "$RUNTIME" --self-contained "$SELF_CONTAINED" -p:Version="$version" -o publish
          printf '%s\n' "$GITHUB_SHA" > publish/source-revision.txt
          platform="$RUNTIME"
          case "$RUNTIME" in win-*) platform="windows-${RUNTIME#win-}" ;; osx-*) platform="macos-${RUNTIME#osx-}" ;; esac
          prefix=automaton-runner
          if [[ "$SELF_CONTAINED" == true ]]; then prefix=automaton-runner-standalone; fi
          archive="$prefix-$platform-v$version"
          if [[ "$RUNTIME" == win-* ]]; then
            archive="$archive.zip"
            (cd publish && zip -qr "../$archive" .)
          else
            archive="$archive.tar.gz"
            tar -czf "$archive" -C publish .
          fi
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.runtime }}-${{ matrix.self-contained }}
          path: |
            automaton-runner-*.tar.gz
            automaton-runner-*.zip
            automaton-runner-*.sha256
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-*
          merge-multiple: true
          path: artifacts
      - name: Publish native archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then tag="runner-native-v$version"; fi
          options=(--target "$GITHUB_SHA" --title "Automaton Runner $version" --generate-notes --latest=false)
          if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
          gh release create "$tag" "${options[@]}" artifacts/*
