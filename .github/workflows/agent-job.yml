name: Agent job

# Reusable: runs one Claude prompt file on an agent machine. Callers decide who may trigger it
# (issues: labeled by the owner or bot, schedule, workflow_dispatch; never pull_request).
on:
  workflow_call:
    inputs:
      prompt-file:
        description: Prompt file in the repository, for example .agents/jobs/lessons.md
        required: true
        type: string
      issue-url:
        description: Replaces ISSUE_URL in the prompt
        required: false
        type: string
        default: ''
      timeout:
        description: Longest run, timeout(1) syntax
        required: false
        type: string
        default: 3h
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: [self-hosted, agent]
    timeout-minutes: 190
    steps:
      - name: Refuse unknown actors
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in schedule) exit 0 ;; esac
          case "$ACTOR" in rzvdaniel|rzvdaniel-bot) exit 0 ;; esac
          echo "::error::actor $ACTOR may not start agent work"; exit 1
      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: ${{ inputs.prompt-file }}
          ISSUE_URL: ${{ inputs.issue-url }}
          AGENT_TASK_TIMEOUT: ${{ inputs.timeout }}
        run: bash "$HOME/automaton/.agents/tools/agent-run.sh"
