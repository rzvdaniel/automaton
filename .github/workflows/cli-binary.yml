name: CLI standalone binary
on:
  pull_request:
    paths:
      - src/Automaton.Cli/**
      - src/Automaton.Core/**
      - src/Automaton.AiGuidance/**
      - scripts/cli/**
      - .github/workflows/cli-binary.yml
permissions:
  contents: read
jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install script syntax
        run: sh -n scripts/cli/install.sh
      - name: Publish a self-contained single file and run it
        run: |
          set -euo pipefail
          dotnet publish src/Automaton.Cli/Automaton.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.2.3 -o publish
          env -i PATH="/usr/bin:/bin" HOME="$RUNNER_TEMP" ./publish/automaton --help
          env -i PATH="/usr/bin:/bin" HOME="$RUNNER_TEMP" ./publish/automaton --version | grep -q '^Version: 1.2.3'
  install-ps1:
    name: install.ps1 (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the Windows binary and its checksum
        shell: pwsh
        run: |
          dotnet publish src/Automaton.Cli/Automaton.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.2.3 -o publish
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Path site | Out-Null
          Copy-Item publish/automaton.exe site/automaton-win-x64.exe
          $hash = (Get-FileHash site/automaton-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/site/automaton-win-x64.exe.sha256", "$hash  automaton-win-x64.exe`n")
          $bad = "0" * 64
          [System.IO.File]::WriteAllText("$PWD/site/bad.sha256", "$bad  automaton-win-x64.exe`n")
      - name: Serve the release files (checksums as octet-stream, like GitHub)
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m","http.server","8099","--directory","site","--bind","127.0.0.1" -WindowStyle Hidden
          for ($i = 0; $i -lt 20; $i++) { try { Invoke-WebRequest http://127.0.0.1:8099/automaton-win-x64.exe.sha256 -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
      - name: Install with PowerShell 7
        shell: pwsh
        run: |
          $env:AUTOMATON_DOWNLOAD_BASE = "http://127.0.0.1:8099"
          $env:AUTOMATON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "ps7\bin"
          & ./scripts/cli/install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $v = & (Join-Path $env:AUTOMATON_INSTALL_DIR "automaton.exe") --version
          if (-not ($v -match "Version: 1.2.3")) { throw "automaton --version did not report 1.2.3: $v" }
      - name: Install with Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:AUTOMATON_DOWNLOAD_BASE = "http://127.0.0.1:8099"
          $env:AUTOMATON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "ps51\bin"
          & ./scripts/cli/install.ps1
          $v = & (Join-Path $env:AUTOMATON_INSTALL_DIR "automaton.exe") --version
          if (-not ($v -match "Version: 1.2.3")) { throw "automaton --version did not report 1.2.3: $v" }
      - name: A tampered checksum is refused (PowerShell 7 and 5.1)
        shell: pwsh
        run: |
          # Serve a second tree where the checksum is wrong.
          New-Item -ItemType Directory -Path bad | Out-Null
          Copy-Item site/automaton-win-x64.exe bad/automaton-win-x64.exe
          Copy-Item site/bad.sha256 bad/automaton-win-x64.exe.sha256
          Start-Process python -ArgumentList "-m","http.server","8098","--directory","bad","--bind","127.0.0.1" -WindowStyle Hidden
          Start-Sleep 3
          foreach ($exe in "pwsh", "powershell") {
            $dir = Join-Path $env:RUNNER_TEMP "tampered-$exe"
            $cmd = '$env:AUTOMATON_DOWNLOAD_BASE="http://127.0.0.1:8098"; $env:AUTOMATON_INSTALL_DIR="' + $dir + '"; & ./scripts/cli/install.ps1'
            & $exe -NoProfile -Command $cmd
            if ($LASTEXITCODE -eq 0) { throw "$exe installed despite a wrong checksum" }
            if (Test-Path (Join-Path $dir "automaton.exe")) { throw "$exe left a binary after a wrong checksum" }
          }
          $global:LASTEXITCODE = 0
