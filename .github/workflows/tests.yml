name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # PostgreSQL integration tests create and drop their own databases on this server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOMATON_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci-test-only
    strategy:
      fail-fast: false
      matrix:
        project: [Api, Cli, Core, Runner, Worker, Ai, Architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: >
          dotnet test src/UnitTests/Automaton.${{ matrix.project }}.Tests
          -p:WarningsAsErrors=nullable%3BNU1902%3BNU1903%3BNU1904
          --logger "console;verbosity=minimal"

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-doc-links.mjs

  scripts:
    name: Migration script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tests/mysql-to-postgres-conversion-test.py
      - run: python3 scripts/tests/postgres-migration-override-test.py
      - run: python3 scripts/tests/server-install-dns-test.py
      - run: python3 scripts/tests/server-install-certificate-test.py
      - run: bash -n docker/install/migrate-to-postgresql.sh
      - run: bash -n docker/install/update-from-request.sh
      - run: python3 scripts/tests/server-update-request-test.py
      - run: |
          sudo apt-get install -y python3-cryptography
          sudo python3 scripts/tests/server-updater-test.py

  action-pins:
    name: Pinned action shas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 .agents/tools/test_check_action_pins.py
      - run: python3 .agents/tools/check-action-pins.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  studio:
    name: Studio tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The runtime log tests expect a 24-hour clock, as on the developers' machines.
      LANG: en_GB.UTF-8
    defaults:
      run:
        working-directory: src/automaton-studio-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/automaton-studio-vue/package-lock.json
            src/automaton-vue/package-lock.json
      # Studio tests import shared config from the website project, which needs its own packages.
      - run: npm ci
        working-directory: src/automaton-vue
      - run: npm ci
      - name: Type-check (as the release build does)
        run: npx vue-tsc --noEmit -p tsconfig.app.json
      - name: Lint (ESLint, errors fail the build)
        run: npm run lint:check -- --quiet
      - run: npm test
      - name: Audit packages (high or critical advisories fail)
        run: npm audit --audit-level=high
      - name: Audit website packages
        run: npm audit --audit-level=high
        working-directory: src/automaton-vue

  dotnet-packages:
    name: Vulnerable .NET packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Automaton.All.sln
      - name: List vulnerable packages
        run: |
          dotnet list Automaton.All.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A project uses a package with a known vulnerability (listed above)."
            exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
