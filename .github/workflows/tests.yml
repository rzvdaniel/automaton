name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [Api, Cli, Core, Runner, Worker, Ai, Architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: >
          dotnet test src/UnitTests/Automaton.${{ matrix.project }}.Tests
          --logger "console;verbosity=minimal"

  studio:
    name: Studio tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The runtime log tests expect a 24-hour clock, as on the developers' machines.
      LANG: en_GB.UTF-8
    defaults:
      run:
        working-directory: src/automaton-studio-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/automaton-studio-vue/package-lock.json
            src/automaton-vue/package-lock.json
      # Studio tests import shared config from the website project, which needs its own packages.
      - run: npm ci
        working-directory: src/automaton-vue
      - run: npm ci
      - run: npm test
