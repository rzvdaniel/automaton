name: Dependency audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full audit (dev tools included) and advisory issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          : > report.md
          for dir in src/automaton-studio-vue src/automaton-vue src/automaton-store-vue; do
            (cd "$dir" && npm audit --json > "$GITHUB_WORKSPACE/audit.json" || true)
            python3 - "$dir" >> report.md <<'PY'
          import json, sys
          d = json.load(open("audit.json"))
          bad = []
          for name, v in d.get("vulnerabilities", {}).items():
              if v["severity"] not in ("high", "critical"):
                  continue
              urls = sorted({s["url"] for s in v["via"] if isinstance(s, dict) and "url" in s})
              bad.append(f"- `{name}` ({v['severity']}{', direct' if v['isDirect'] else ''}) {' '.join(urls)}")
          if bad:
              print(f"### {sys.argv[1]}\n" + "\n".join(bad) + "\n")
          PY
          done
          num=$(gh issue list --label dependency-advisory --state open --json number --jq '.[0].number // empty')
          if [ -s report.md ]; then
            { echo "The nightly audit (dev tools included) found high or critical advisories on main:"; echo; cat report.md
              echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > body.md
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file body.md
            else
              gh issue create --label dependency-advisory --title "High or critical npm advisories on main" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "The nightly audit is clean."
          fi
