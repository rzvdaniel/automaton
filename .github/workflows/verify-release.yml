name: Verify release

# Starts the release verification by itself once the test server runs a version nobody has checked yet and issues wait
# in Verify (#1800). It polls the installed version, so it works however the test server was upgraded.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # No concurrency group: a poll that finds nothing must not queue behind, or cancel, an Agent issue run.
    runs-on: [self-hosted, agent]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check whether a version needs verifying
        id: check
        run: |
          out=$(bash "$HOME/automaton/.agents/tools/verify-trigger.sh" check)
          echo "$out"
          case $out in "run "*) echo "version=${out#run }" >> "$GITHUB_OUTPUT" ;; esac

  verify:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: [self-hosted, agent]
    timeout-minutes: 190
    concurrency:
      group: agent
      cancel-in-progress: false
    steps:
      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: .agents/jobs/verify-release.md
          ISSUE_URL: ${{ needs.check.outputs.version }}  # agent-run.sh puts it where the prompt says ISSUE_URL
          AGENT_TASK_TIMEOUT: 180m
          AGENT_MODEL: opus
        run: |
          # Record the attempt first: a failed run must not restart every 10 minutes. Re-run it by hand.
          bash "$HOME/automaton/.agents/tools/verify-trigger.sh" done "$ISSUE_URL"
          bash "$HOME/automaton/.agents/tools/agent-run.sh"
