name: Verify release

# Starts the release verification by itself once the test server runs a version nobody has checked yet and issues wait
# in Verify (#1800). It polls the installed version, so it works however the test server was upgraded.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # No concurrency group: a poll that finds nothing must not queue behind, or cancel, an Agent issue run.
    runs-on: [self-hosted, agent]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check whether a version needs verifying
        id: check
        run: |
          out=$(bash "$HOME/automaton/.agents/tools/verify-trigger.sh" check)
          echo "$out"
          case $out in "run "*) echo "version=${out#run }" >> "$GITHUB_OUTPUT" ;; esac

  verify:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: [self-hosted, agent]
    timeout-minutes: 190
    concurrency:
      group: agent
      cancel-in-progress: false
    steps:
      - name: Claim version for verification
        id: claim
        env:
          ISSUE_URL: ${{ needs.check.outputs.version }}
        run: |
          # Record the attempt first: a failed run must not restart every 10 minutes. To retry, run `verify-trigger.sh reset` on the runner; the next poll starts it again.
          # Several triggered runs can pass the check together; only the one that records the version goes on (exit 3).
          rc=0; bash "$HOME/automaton/.agents/tools/verify-trigger.sh" done "$ISSUE_URL" || rc=$?
          if [[ $rc -eq 3 ]]; then echo "claimed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ $rc -eq 0 ]] || exit "$rc"
          echo "claimed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.claim.outputs.claimed == 'true'
        with:
          persist-credentials: false
      - name: Run Claude
        id: agent
        if: steps.claim.outputs.claimed == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: .agents/jobs/verify-release.md
          ISSUE_URL: ${{ needs.check.outputs.version }}  # agent-run.sh puts it where the prompt says ISSUE_URL
          AGENT_TASK_TIMEOUT: 180m
          AGENT_MODEL: opus
        run: bash "$HOME/automaton/.agents/tools/agent-run.sh"
      - name: Post Release summary issue
        if: steps.claim.outputs.claimed == 'true' && !cancelled()
        env:
          VERSION: ${{ needs.check.outputs.version }}
          VERIFY_OUTCOME: ${{ steps.agent.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .agents/tools/release-summary.py --version "$VERSION" --verify-outcome "$VERIFY_OUTCOME" --run-url "$RUN_URL"
      - name: Fail job if verification agent failed
        if: steps.claim.outputs.claimed == 'true' && steps.agent.outcome != 'success'
        run: exit 1
