name: Verify release

# Starts the release verification by itself once the test server runs a version nobody has checked yet and issues wait
# in Verify (#1800). It polls the installed version, so it works however the test server was upgraded.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # No concurrency group: a poll that finds nothing must not queue behind, or cancel, an Agent issue run.
    runs-on: [self-hosted, agent]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check whether a version needs verifying
        id: check
        run: |
          out=$(bash "$HOME/automaton/.agents/tools/verify-trigger.sh" check)
          echo "$out"
          case $out in "run "*) echo "version=${out#run }" >> "$GITHUB_OUTPUT" ;; esac

  verify:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: [self-hosted, agent]
    timeout-minutes: 190
    concurrency:
      group: agent
      cancel-in-progress: false
    steps:
      - name: Run the verifier
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: .agents/jobs/verify-release.md
          ISSUE_URL: ${{ needs.check.outputs.version }}  # agent-run.sh puts it where the prompt says ISSUE_URL
          AGENT_TASK_TIMEOUT: 180m
          # Repo variables: AGENT_VERIFY_CLI claude|agy and AGENT_VERIFY_MODEL (claude: opus); the agy fallback as for agent issues.
          AGENT_CLI: ${{ vars.AGENT_VERIFY_CLI }}
          AGENT_MODEL: ${{ vars.AGENT_VERIFY_MODEL || 'opus' }}
          AGENT_FALLBACK_CLI: ${{ vars.AGENT_FALLBACK_CLI }}
          AGENT_FALLBACK_MODEL: ${{ vars.AGENT_FALLBACK_MODEL }}
        run: |
          # Record the attempt first: a failed run must not restart every 10 minutes. To retry, run `verify-trigger.sh reset` on the runner; the next poll starts it again.
          # Several triggered runs can pass the check together; only the one that records the version goes on (exit 3).
          rc=0; bash "$HOME/automaton/.agents/tools/verify-trigger.sh" done "$ISSUE_URL" || rc=$?
          [[ $rc -ne 3 ]] || exit 0
          [[ $rc -eq 0 ]] || exit "$rc"
          bash "$HOME/automaton/.agents/tools/agent-run.sh"
