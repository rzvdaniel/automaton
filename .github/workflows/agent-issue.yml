name: Agent issue

on:
  issues:
    types: [labeled]
  # agent-board.sh pick starts issues from other repositories (automaton-apps) this way; the runner lives here.
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/repo of the issue'
        required: true
      number:
        description: 'Issue number'
        required: true

permissions:
  contents: read

jobs:
  run:
    # Only the owner or the bot adding agent:go; never a pull_request trigger.
    if: (github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:go') && contains(fromJSON('["rzvdaniel","rzvdaniel-bot"]'), github.actor)
    concurrency:
      group: agent
      cancel-in-progress: false
    runs-on: [self-hosted, agent]
    timeout-minutes: 190
    steps:
      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: .agents/jobs/implement-issue.md
          ISSUE_URL: ${{ github.event.issue.html_url || format('https://github.com/{0}/issues/{1}', inputs.repo, inputs.number) }}
          AGENT_REPO: ${{ inputs.repo || github.repository }}
          AGENT_TASK_TIMEOUT: 180m
        run: bash "$HOME/automaton/.agents/tools/agent-run.sh"
      - name: Finish an open pull request that only lacks reviews
        # Posts the missing main review / security pass with the runner's other logins and merges through the gate.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_REPO: ${{ inputs.repo || github.repository }}
          NUMBER: ${{ github.event.issue.number || inputs.number }}
          AGENT_TASK_TIMEOUT: 60m
        run: bash "$HOME/automaton/.agents/tools/agent-finish-pr.sh"

  finish:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: [self-hosted, agent]
    timeout-minutes: 10
    env:
      REPO: ${{ inputs.repo || github.repository }}
      NUMBER: ${{ github.event.issue.number || inputs.number }}
      RESULT: ${{ needs.run.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Move the card
        run: |
          B="$HOME/automaton/.agents/tools/agent-board.sh"
          gh issue edit "$NUMBER" -R "$REPO" --remove-label agent:go || true
          # A green job is not enough: the run must have left an open or merged PR that references the issue (#1625).
          HAS_PR=
          if [ "$RESULT" = success ]; then
            HAS_PR=$(gh pr list -R "$REPO" --state all --limit 100 --search "$NUMBER in:title,body" --json number,state,title,body \
              --jq "[.[] | select(.state != \"CLOSED\") | select((.title + \" \" + .body) | test(\"#$NUMBER([^0-9]|$)\"))] | length" || echo 0)
          fi
          if [ "$RESULT" = success ] && [ "${HAS_PR:-0}" -gt 0 ]; then
            "$B" move "$REPO" "$NUMBER" "Verify" || true
          elif [ "$RESULT" = success ]; then
            gh issue edit "$NUMBER" -R "$REPO" --add-label agent:failed || true
            gh issue comment "$NUMBER" -R "$REPO" --body "Agent run ended without a pull request that references this issue: $RUN_URL. Moved to Inbox, it needs the owner. Comment here and move the card to Ready for agents to let it run again." || true
            "$B" move "$REPO" "$NUMBER" "Inbox" || true
          else
            gh issue edit "$NUMBER" -R "$REPO" --add-label agent:failed || true
            gh issue comment "$NUMBER" -R "$REPO" --body "Agent run failed ($RESULT): $RUN_URL. Moved to Inbox, it needs the owner. Comment here and move the card to Ready for agents to let it run again." || true
            "$B" move "$REPO" "$NUMBER" "Inbox" || true
          fi
          # Agent Keeper's Pick up Action (every 10 minutes) starts the next card.

  refuse:
    # agent:go added by anyone else: take it off again so the queue is not blocked
    if: github.event_name == 'issues' && github.event.label.name == 'agent:go' && !contains(fromJSON('["rzvdaniel","rzvdaniel-bot"]'), github.actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --remove-label agent:go
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "Refused: only the owner or the bot may start agent work (label added by $ACTOR)."
