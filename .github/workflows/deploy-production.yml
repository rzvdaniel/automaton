name: Deploy production

# Manual only. The `production` environment needs the owner's approval, only accepts runs from main, and holds the
# SSH settings as environment secrets. Setup: docs/prod/deploy-from-github.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy, for example 0.2.103
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Runs before the environment approval, so the run page shows the AI verdict and the report to read first.
  # Red is a warning only; it never blocks the deploy.
  report:
    name: Release report ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show the verdict
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 0.2.103."; exit 1; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/server-v$VERSION"
          body=$(gh release view "server-v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          section=$(printf '%s\n' "$body" | sed -n '/^## AI check/,/^## Automaton Server/p' | sed '$d')
          verdict=$(printf '%s\n' "$section" | grep -m1 -E '^Verdict: (Green|Yellow|Red)$' | sed 's/^Verdict: //' || true)
          {
            echo "### Release $VERSION: AI check ${verdict:-unavailable}"
            echo
            if [[ "$verdict" == Red ]]; then echo "**Red: read the report before approving.** This is a warning; it does not block the deploy."; echo; fi
            printf '%s\n' "$section"
            echo "[Full release report]($url)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ inputs.version }}
    needs: report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 0.2.103."; exit 1; }
          echo "Deploying $VERSION, approved by the environment reviewer, started by $GITHUB_ACTOR."

      - name: Update production
        env:
          VERSION: ${{ inputs.version }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$dir/key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          # update.sh takes the release tag as --version server-vX.Y.Z.
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sudo /usr/bin/bash /opt/automaton-server/update.sh --version server-v$VERSION"

      - name: Check the public routes
        run: |
          set -euo pipefail
          for url in https://api.automaton.monster/health https://studio.automaton.monster https://store.automaton.monster https://automaton.monster; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
              if [[ "$code" == 200 ]]; then ok=true; break; fi
              sleep 10
            done
            echo "$url -> $code"
            [[ "$ok" == true ]] || exit 1
          done
