name: Pack CLI and Runner

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet version, e.g. 1.0.20261027.1'
        required: true
      publish:
        description: 'Publish to NuGet.org (requires NUGET_ORG_API_KEY and main)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        project: [Automaton.Cli, Automaton.Runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Validate release settings
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'NuGet publication is allowed only from main.' >&2
            exit 1
          fi
      - name: Build and pack
        env:
          VERSION: ${{ inputs.version }}
          PROJECT: ${{ matrix.project }}
        run: dotnet pack "src/$PROJECT/$PROJECT.csproj" -c Release -p:Version="$VERSION" -p:AssemblyVersion=1.0.0.0 -p:FileVersion=1.0.0.0 -o packages
      - name: Record checksums and source
        run: |
          sha256sum packages/*.nupkg > packages/checksums.txt
          printf '%s\n' "$GITHUB_SHA" > packages/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-packages
          path: packages
      - name: Publish to NuGet.org
        if: inputs.publish
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          if [[ -z "$NUGET_ORG_API_KEY" ]]; then
            echo 'Configure the NUGET_ORG_API_KEY GitHub Actions secret before publishing.' >&2
            exit 1
          fi
          dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_ORG_API_KEY" --skip-duplicate
