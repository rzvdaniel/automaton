name: Release install check
# Checks a commit build (nightly on main, or on demand) or a published server release on a throwaway Hetzner server
# (separate project "automaton-ci"), running upgrade, fresh install, external/API scans and backup/restore, then deletes it.
# Needs repository secrets HCLOUD_TOKEN and CLOUDFLARE_DNS_TOKEN; without them the check job fails at the first step.
on:
  workflow_run:
    workflows: ['Publish Automaton Server']
    types: [completed]
  schedule:
    # Nightly install check against a build of main (images tagged by commit, mode all).
    - cron: '23 1 * * *'
    # The default certificate path (Traefik, Let's Encrypt): fresh mode against the newest published release, ~5 certs/week.
    - cron: '17 22 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to check: commit (build this ref) or release (a published server-v* release)'
        type: choice
        options: [commit, release]
        default: commit
      version:
        description: 'Published release to check, e.g. 0.2.195 (checks that release instead of building this commit)'
        required: false
      server_types:
        description: 'Server types to try in order'
        default: 'cx23 cpx12'
      locations:
        description: 'Locations to try in order'
        default: 'nbg1 fsn1 hel1'
      mode:
        description: 'What to run: all (one server, rebuilt between steps), or fresh, upgrade or restore alone'
        type: choice
        options: [all, fresh, upgrade, restore]
        default: all
      tls:
        description: "Certificates: custom is the shared CI certificate, letsencrypt asks Let's Encrypt"
        type: choice
        options: [custom, letsencrypt]
        default: custom
      restore_wrong_key:
        description: 'Test the failure path: restore with a wrong key (the run must fail at the restore job)'
        type: boolean
        default: false
run-name: >-
  ${{
    (github.event_name == 'schedule' && github.event.schedule != '17 22 * * 0' && 'Release install check (commit all)')
    || (github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.target != 'release' && !inputs.restore_wrong_key && format('Release install check (commit {0})', inputs.mode || 'all'))
    || format('Release install check ({0})', github.event_name)
  }}
permissions:
  contents: read
# One server at a time: runs share the Cloudflare zone and the hcloud project.
concurrency:
  group: release-install-check
  cancel-in-progress: false
env:
  HCLOUD_VERSION: '1.62.0'  # server rebuild --user-data-from-file needs 1.62 or later
jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      mode: ${{ steps.resolve.outputs.mode }}
      tls: ${{ steps.resolve.outputs.tls }}
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.resolve.outputs.previous }}
      ref: ${{ steps.resolve.outputs.ref }}
      is_nightly: ${{ steps.resolve.outputs.is_nightly }}
    steps:
      - name: Resolve check target and versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TLS: ${{ inputs.tls }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          is_nightly=false
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            target=release
            mode=all
            tls=custom
          elif [[ "$EVENT_NAME" == schedule ]]; then
            if [[ "$SCHEDULE_CRON" == '17 22 * * 0' ]]; then
              target=release
              mode=fresh
              tls=letsencrypt
            else
              target=commit
              mode=all
              tls=custom
              is_nightly=true
            fi
          else
            target="${INPUT_TARGET:-commit}"
            [[ -z "$INPUT_VERSION" ]] || target=release
            mode="${INPUT_MODE:-all}"
            tls="${INPUT_TLS:-custom}"
          fi

          mapfile -t tags < <(gh release list --limit 100 --json tagName,isDraft,isPrerelease,createdAt \
            --jq '[.[] | select((.isDraft or .isPrerelease) | not) | select(.tagName | startswith("server-v"))] | sort_by(.createdAt) | reverse | .[].tagName')

          if [[ "$target" == release ]]; then
            current="${INPUT_VERSION:+server-v$INPUT_VERSION}"; current="${current:-${tags[0]:-}}"
            [[ -n "$current" ]] || { echo "::error::No published server release found."; exit 1; }
            printf '%s\n' "${tags[@]}" | grep -qxF -- "$current" || { echo "::error::$current is not a published server release."; exit 1; }
            previous=''
            for t in "${tags[@]}"; do [[ "$t" != "$current" ]] && { previous="$t"; break; }; done
            if [[ "$mode" == upgrade || "$mode" == all ]]; then
              [[ -n "$previous" ]] || { echo "::error::No previous server release to upgrade from."; exit 1; }
            fi
            version="${current#server-v}"
            previous="${previous#server-v}"
            ref="$current"
          else
            latest="${tags[0]:-}"
            previous="${latest#server-v}"
            if [[ "$mode" == upgrade || "$mode" == all ]]; then
              [[ -n "$previous" ]] || { echo "::error::No published server release to upgrade from."; exit 1; }
            fi
            short_sha="${COMMIT_SHA:0:7}"
            if [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-ci.$short_sha"
            else
              version="0.0.1-ci.$short_sha"
            fi
            ref="$COMMIT_SHA"
          fi

          {
            echo "target=$target"
            echo "mode=$mode"
            echo "tls=$tls"
            echo "version=$version"
            echo "previous=$previous"
            echo "ref=$ref"
            echo "is_nightly=$is_nightly"
          } >> "$GITHUB_OUTPUT"

  # Builds the API's OpenAPI file from the target source (Swagger stays off on servers). It runs the API startup
  # code, so this job has no secrets, only a read-only token, and passes the file on as an artifact.
  openapi:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spec
          POSTGRES_PASSWORD: spec
          POSTGRES_DB: spec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spec" --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.target == 'commit'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          path: release-src
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.plan.outputs.target == 'release'
        with:
          ref: server-v${{ needs.plan.outputs.version }}
          path: release-src
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Not blocking (owner, 2026-11-27): if the spec cannot be built, the install, upgrade, restore and baseline scans still run
      # and only the signed-in API scan is skipped with a warning. Fixing the generation for good is automaton#1792.
      - name: Generate openapi.json
        continue-on-error: true
        run: |
          set -euo pipefail
          dotnet build release-src/src/Automaton.Api/Automaton.Api.csproj -c Release -v minimal -o "$RUNNER_TEMP/api-build"
          # The Swashbuckle CLI cannot load the API's Microsoft.OpenApi (automaton#1792), so the built API serves its own spec in Development, on loopback, with throwaway values and the empty Postgres service above.
          export AuthenticationSettings__HMacSettings__SecretKey="$(openssl rand -hex 32)" RabbitMq__Host=localhost RabbitMq__Username=spec RabbitMq__Password=spec Logging__File__Path="$RUNNER_TEMP/api-logs" ConnectionStrings__PostgreSqlConnection="Host=localhost;Port=5432;Database=spec;Username=spec;Password=spec" ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5099
          dotnet "$RUNNER_TEMP/api-build/Automaton.Api.dll" > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS -o "$RUNNER_TEMP/openapi.json" http://127.0.0.1:5099/swagger/v1/swagger.json && break
            kill -0 "$api_pid" 2>/dev/null || { tail -n 30 "$RUNNER_TEMP/api.log"; exit 1; }
            sleep 2
          done
          jq -e '.paths | length > 1' "$RUNNER_TEMP/openapi.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi.json
          retention-days: 3
          if-no-files-found: ignore

  # For commit-build runs, builds and pushes images tagged by commit (no GitHub Release is published).
  images:
    needs: plan
    if: github.event_name != 'workflow_run' && needs.plan.outputs.target == 'commit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [server, worker, studio, store, age]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set repository name
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.repository.outputs.name }}-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            VITE_RUNTIME_CONFIG=true
            SERVER_VERSION=${{ needs.plan.outputs.version }}
            VITE_API_BASE_URL=
            VITE_PUBLIC_APPS_BASE_URL=
            VITE_GITHUB_AUTH_API_BASE_URL=
            VITE_SUBSCRIPTIONS_ENABLED=false
            VITE_APP_TITLE=Automaton Studio
      - name: Export image reference
        env:
          IMAGE: ghcr.io/${{ steps.repository.outputs.name }}-${{ matrix.component }}@${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: printf '%s\n' "$IMAGE" > "$COMPONENT.image"
      - name: Smoke test age tool image
        if: matrix.component == 'age'
        env:
          IMAGE: ghcr.io/${{ steps.repository.outputs.name }}-age:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" age --version
          docker run --rm "$IMAGE" age-keygen --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: '*.image'
          retention-days: 1

  bundle:
    needs: [plan, images]
    if: github.event_name != 'workflow_run' && needs.plan.outputs.target == 'commit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble commit bundle
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/build-server-bundle.sh
          tar -czf automaton-server.tar.gz automaton-server
          sha256sum automaton-server.tar.gz > automaton-server.tar.gz.sha256
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build CLI binary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish src/Automaton.Cli/Automaton.Cli.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$VERSION" -p:AssemblyVersion=1.0.0.0 -p:FileVersion=1.0.0.0 -o cli-publish
          cp cli-publish/automaton automaton
          chmod +x automaton
          DOTNET_ROOT=/nonexistent ./automaton --version
      - uses: actions/upload-artifact@v4
        with:
          name: commit-bundle
          path: |
            automaton-server.tar.gz
            automaton-server.tar.gz.sha256
            automaton
          retention-days: 1

  check:
    needs: [plan, openapi, bundle]
    if: |
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.openapi.result == 'success' &&
      (needs.bundle.result == 'success' || needs.bundle.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      # Optional: our own downloads are reported to Head Counter (automaton#1802); unset means nothing is sent.
      HEAD_COUNTER_URL: ${{ secrets.HEAD_COUNTER_URL }}
      HEAD_COUNTER_TOKEN: ${{ secrets.HEAD_COUNTER_TOKEN }}
      # The shared wildcard from ci-certificate.yml: installs with --tls-mode custom, no Let's Encrypt request per run.
      # When tls=letsencrypt they stay empty: the install then asks Let's Encrypt (the default path).
      CI_TLS_CERT: ${{ needs.plan.outputs.tls == 'letsencrypt' && '' || secrets.CI_TLS_CERT }}
      CI_TLS_KEY: ${{ needs.plan.outputs.tls == 'letsencrypt' && '' || secrets.CI_TLS_KEY }}
      SERVER_TYPES: ${{ inputs.server_types || 'cx23 cpx12' }}
      LOCATIONS: ${{ inputs.locations || 'nbg1 fsn1 hel1' }}
      RUN_ID: ${{ github.run_id }}
    steps:
      # On commit-build and workflow_dispatch runs, check out that commit so PR/branch changes to the check are tested; other triggers use the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (needs.plan.outputs.target == 'commit' || github.event_name == 'workflow_dispatch') && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require the secrets
        run: |
          [[ -n "$HCLOUD_TOKEN" && -n "$CLOUDFLARE_DNS_TOKEN" ]] || { echo "::error::Set the HCLOUD_TOKEN and CLOUDFLARE_DNS_TOKEN repository secrets."; exit 1; }
      - name: Install nmap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap
      - name: Install hcloud
        run: |
          curl -fsSL "https://github.com/hetznercloud/cli/releases/download/v${HCLOUD_VERSION}/hcloud-linux-amd64.tar.gz" -o hcloud.tgz
          sudo tar -xzf hcloud.tgz -C /usr/local/bin hcloud
          hcloud version
      - name: Write step summary header
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$TARGET" == commit ]]; then
            echo "### Release install check: commit \`${COMMIT_SHA:0:12}\` ($VERSION, upgrade from ${PREVIOUS:-none})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release install check: $VERSION (upgrade from ${PREVIOUS:-none})" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The OpenAPI file comes from the "openapi" job, which builds the target source without any secret.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.target == 'commit'
        with:
          name: commit-bundle
          path: ${{ runner.temp }}/commit-bundle
      - name: Use the OpenAPI file for the signed-in API scan
        run: |
          if [[ ! -s "$RUNNER_TEMP/openapi/openapi.json" ]]; then
            echo "::warning::No OpenAPI file (the openapi job could not build it): the signed-in API scan is skipped. See automaton#1792."
            echo "- OpenAPI file: missing, signed-in API scan skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "API_SPEC=$RUNNER_TEMP/openapi/openapi.json" >> "$GITHUB_ENV"
          echo "- OpenAPI file: $(jq '.paths | length' "$RUNNER_TEMP/openapi/openapi.json") paths" >> "$GITHUB_STEP_SUMMARY"
      # One server for the run: upgrade and scan, back up, rebuild, fresh install and scan, restore, delete.
      - name: Upgrade, fresh install and restore on one rebuilt server
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          RESTORE_WRONG_KEY: ${{ inputs.restore_wrong_key && '1' || '' }}
          MODE: ${{ needs.plan.outputs.mode }}
          TLS_MODE: ${{ needs.plan.outputs.tls }}
          TARGET: ${{ needs.plan.outputs.target }}
        run: |
          if [[ "$TARGET" == commit ]]; then
            export BUNDLE_ARCHIVE="$RUNNER_TEMP/commit-bundle/automaton-server.tar.gz"
            export BUNDLE_CHECKSUM="$RUNNER_TEMP/commit-bundle/automaton-server.tar.gz.sha256"
            export CLI_BINARY="$RUNNER_TEMP/commit-bundle/automaton"
            chmod +x "$CLI_BINARY"
          fi
          bash scripts/ci/release-install-check.sh "$MODE"
      # The scripts delete what they create; this also covers a cancelled run.
      - name: Delete leftover servers of this run
        if: always()
        run: |
          for id in $(hcloud server list -l "automaton-ci=true,run=$RUN_ID" -o json | jq -r '.[].id'); do hcloud server delete "$id"; done
          for id in $(hcloud ssh-key list -l automaton-ci=true -o json | jq -r --arg r "automaton-ci-$RUN_ID-" '.[] | select(.name | startswith($r)) | .id'); do hcloud ssh-key delete "$id"; done

  # A failing nightly run on main files or comments on one lesson issue on board 17 Inbox (no duplicates).
  report-failure:
    needs: [plan, openapi, images, bundle, check]
    if: |
      always() &&
      !cancelled() &&
      github.event_name == 'schedule' &&
      needs.plan.outputs.is_nightly == 'true' &&
      (needs.openapi.result == 'failure' || needs.images.result == 'failure' || needs.bundle.result == 'failure' || needs.check.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: File or comment on nightly failure lesson issue
        env:
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAPI_RESULT: ${{ needs.openapi.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          failed=()
          [[ "$OPENAPI_RESULT" == failure ]] && failed+=(openapi)
          [[ "$IMAGES_RESULT" == failure ]] && failed+=(images)
          [[ "$BUNDLE_RESULT" == failure ]] && failed+=(bundle)
          [[ "$CHECK_RESULT" == failure ]] && failed+=(check)
          FAILED_JOBS=$(IFS=, ; echo "${failed[*]:-unknown}")
          export FAILED_JOBS
          bash scripts/ci/report-install-check-failure.sh
