name: Release install check
# Installs each published server release on a throwaway Hetzner server (separate project "automaton-ci"), checks it by
# script, installs the previous release and upgrades it, restores a backup of one install onto a fresh install of the
# same server (rebuilt, so one server per run), then deletes it. Needs the repository secrets
# HCLOUD_TOKEN and CLOUDFLARE_DNS_TOKEN; without them the run fails at the first step.
on:
  workflow_run:
    workflows: ['Publish Automaton Server']
    types: [completed]
  # The default certificate path (Traefik, Let's Encrypt): fresh mode only, about 5 certificates a week.
  schedule:
    - cron: '17 22 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to check, e.g. 0.2.195 (default: the newest server release)'
        required: false
      server_types:
        description: 'Server types to try in order'
        default: 'cx23 cpx12'
      locations:
        description: 'Locations to try in order'
        default: 'nbg1 fsn1 hel1'
      mode:
        description: 'What to run: all (one server, rebuilt between steps), or fresh, upgrade or restore alone'
        type: choice
        options: [all, fresh, upgrade, restore]
        default: all
      tls:
        description: "Certificates: custom is the shared CI certificate, letsencrypt asks Let's Encrypt"
        type: choice
        options: [custom, letsencrypt]
        default: custom
      restore_wrong_key:
        description: 'Test the failure path: restore with a wrong key (the run must fail at the restore job)'
        type: boolean
        default: false
permissions:
  contents: read
# One server at a time: both runs share the Cloudflare zone and the hcloud project.
concurrency:
  group: release-install-check
  cancel-in-progress: false
env:
  HCLOUD_VERSION: '1.62.0'  # server rebuild --user-data-from-file needs 1.62 or later
jobs:
  # Builds the API's OpenAPI file from the release's own source (Swagger stays off on servers). It runs the release's startup
  # code, so this job has no secrets, only a read-only token, and passes the file on as an artifact.
  openapi:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Pick the release
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Only a published, non-draft server release is built: no tag pushed for the purpose.
          mapfile -t tags < <(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select((.isDraft or .isPrerelease) | not) | select(.tagName | startswith("server-v")) | .tagName')
          current="${INPUT_VERSION:+server-v$INPUT_VERSION}"; current="${current:-${tags[0]}}"
          printf '%s\n' "${tags[@]}" | grep -qxF -- "$current" || { echo "::error::$current is not a published server release."; exit 1; }
          echo "version=${current#server-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: server-v${{ steps.versions.outputs.version }}
          path: release-src
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Not blocking (owner, 2026-11-27): if the spec cannot be built, the install, upgrade, restore and baseline scans still run
      # and only the signed-in API scan is skipped with a warning. Fixing the generation for good is automaton#1792.
      - name: Generate openapi.json
        continue-on-error: true
        run: |
          set -euo pipefail
          dotnet tool install Swashbuckle.AspNetCore.Cli --version 7.1.0 --tool-path "$RUNNER_TEMP/swagger"
          dotnet build release-src/src/Automaton.Api/Automaton.Api.csproj -c Release -v minimal -o "$RUNNER_TEMP/api-build"
          # The API refuses to build its host without signing and broker settings; the CLI never connects, so throwaway values are enough.
          AuthenticationSettings__HMacSettings__SecretKey="$(openssl rand -hex 32)" RabbitMq__Host=localhost RabbitMq__Username=spec RabbitMq__Password=spec ConnectionStrings__PostgreSqlConnection="Host=localhost;Database=spec;Username=spec;Password=spec" ASPNETCORE_ENVIRONMENT=Development "$RUNNER_TEMP/swagger/swagger" tofile --output "$RUNNER_TEMP/openapi.json" "$RUNNER_TEMP/api-build/Automaton.Api.dll" v1
          jq -e '.paths | length > 1' "$RUNNER_TEMP/openapi.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi.json
          retention-days: 3
          if-no-files-found: ignore
  check:
    needs: openapi
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      # Optional: our own downloads are reported to Head Counter (automaton#1802); unset means nothing is sent.
      HEAD_COUNTER_URL: ${{ secrets.HEAD_COUNTER_URL }}
      HEAD_COUNTER_TOKEN: ${{ secrets.HEAD_COUNTER_TOKEN }}
      # The shared wildcard from ci-certificate.yml: installs with --tls-mode custom, no Let's Encrypt request per run.
      # A scheduled run and tls=letsencrypt leave them empty: the install then asks Let's Encrypt (the default path).
      CI_TLS_CERT: ${{ (github.event_name == 'schedule' || inputs.tls == 'letsencrypt') && '' || secrets.CI_TLS_CERT }}
      CI_TLS_KEY: ${{ (github.event_name == 'schedule' || inputs.tls == 'letsencrypt') && '' || secrets.CI_TLS_KEY }}
      SERVER_TYPES: ${{ inputs.server_types || 'cx23 cpx12' }}
      LOCATIONS: ${{ inputs.locations || 'nbg1 fsn1 hel1' }}
      RUN_ID: ${{ github.run_id }}
    steps:
      # Checks out the default branch, never the commit under test: the script is the trusted part.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require the secrets
        run: |
          [[ -n "$HCLOUD_TOKEN" && -n "$CLOUDFLARE_DNS_TOKEN" ]] || { echo "::error::Set the HCLOUD_TOKEN and CLOUDFLARE_DNS_TOKEN repository secrets."; exit 1; }
      - name: Install nmap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap
      - name: Install hcloud
        run: |
          curl -fsSL "https://github.com/hetznercloud/cli/releases/download/v${HCLOUD_VERSION}/hcloud-linux-amd64.tar.gz" -o hcloud.tgz
          sudo tar -xzf hcloud.tgz -C /usr/local/bin hcloud
          hcloud version
      - name: Pick the releases
        id: versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh release list --limit 100 --json tagName,isDraft,isPrerelease,createdAt \
            --jq '[.[] | select((.isDraft or .isPrerelease) | not) | select(.tagName | startswith("server-v"))] | sort_by(.createdAt) | reverse | .[].tagName')
          current="server-v${{ needs.openapi.outputs.version }}"
          previous=''
          for t in "${tags[@]}"; do [[ "$t" != "$current" ]] && { previous="$t"; break; }; done
          [[ -n "$previous" ]] || { echo "::error::No previous server release to upgrade from."; exit 1; }
          echo "version=${current#server-v}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous#server-v}" >> "$GITHUB_OUTPUT"
          echo "### Release install check: ${current#server-v} (upgrade from ${previous#server-v})" >> "$GITHUB_STEP_SUMMARY"
      # The OpenAPI file comes from the "openapi" job, which builds the release source without any secret.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi
      - name: Use the OpenAPI file for the signed-in API scan
        run: |
          if [[ ! -s "$RUNNER_TEMP/openapi/openapi.json" ]]; then
            echo "::warning::No OpenAPI file (the openapi job could not build it): the signed-in API scan is skipped. See automaton#1792."
            echo "- OpenAPI file: missing, signed-in API scan skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "API_SPEC=$RUNNER_TEMP/openapi/openapi.json" >> "$GITHUB_ENV"
          echo "- OpenAPI file: $(jq '.paths | length' "$RUNNER_TEMP/openapi/openapi.json") paths" >> "$GITHUB_STEP_SUMMARY"
      # One server for the run: upgrade and scan, back up, rebuild, fresh install and scan, restore, delete.
      - name: Upgrade, fresh install and restore on one rebuilt server
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          PREVIOUS: ${{ steps.versions.outputs.previous }}
          RESTORE_WRONG_KEY: ${{ inputs.restore_wrong_key && '1' || '' }}
          # The weekly run is fresh only: the upgrade and restore paths do not depend on the certificate.
          MODE: ${{ github.event_name == 'schedule' && 'fresh' || inputs.mode || 'all' }}
          TLS_MODE: ${{ (github.event_name == 'schedule' || inputs.tls == 'letsencrypt') && 'letsencrypt' || 'custom' }}
        run: bash scripts/ci/release-install-check.sh "$MODE"
      # The scripts delete what they create; this also covers a cancelled run.
      - name: Delete leftover servers of this run
        if: always()
        run: |
          for id in $(hcloud server list -l "automaton-ci=true,run=$RUN_ID" -o json | jq -r '.[].id'); do hcloud server delete "$id"; done
          for id in $(hcloud ssh-key list -l automaton-ci=true -o json | jq -r --arg r "automaton-ci-$RUN_ID-" '.[] | select(.name | startswith($r)) | .id'); do hcloud ssh-key delete "$id"; done
