name: Feature request
description: Suggest something Automaton should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
