# Azure DevOps Pipeline for Automaton Runner Console
# Builds cross-platform console runner for Windows, Linux, and macOS
# Generates ready-to-deploy artifacts for each platform

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Automaton.Runner.Console/**
      - src/Automaton.Core/**
      - src/Automaton.Steps/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Automaton.Runner.Console/**
      - src/Automaton.Core/**
      - src/Automaton.Steps/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  solutionPath: 'Automaton.Runner.Console.sln'
  projectPath: 'src/Automaton.Runner.Console/Automaton.Runner.Console.csproj'
  artifactName: 'automaton-runner'

stages:
  - stage: Build
    displayName: 'Build Cross-Platform Runners'
    jobs:
      - job: BuildRunners
        displayName: 'Build for All Platforms'
        steps:
          # Setup .NET SDK
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
              installationPath: $(Agent.ToolsDirectory)/dotnet

          # List solution contents for debugging
          - script: |
              echo "Using dedicated Runner Console solution: $(solutionPath)"
              echo "Solution contents:"
              dotnet sln $(solutionPath) list
            displayName: 'Show Solution Contents'

          # Restore dependencies using the dedicated solution
          - task: DotNetCoreCLI@2
            displayName: 'Restore Runner Console Solution'
            inputs:
              command: 'restore'
              projects: $(solutionPath)
              feedsToUse: 'select'
              verbosityRestore: 'minimal'

          # Build using the dedicated solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Runner Console Solution'
            inputs:
              command: 'build'
              projects: $(solutionPath)
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Run tests only for Core project (relevant to Runner Console)
          - task: DotNetCoreCLI@2
            displayName: 'Run Core Tests'
            inputs:
              command: 'test'
              projects: 'src/UnitTests/Automaton.Core.Tests/Automaton.Core.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --logger trx --results-directory $(Agent.TempDirectory) --collect:"XPlat Code Coverage"'
            continueOnError: true
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          # Publish for Windows x64
          - task: DotNetCoreCLI@2
            displayName: 'Publish Windows x64'
            inputs:
              command: 'publish'
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --runtime win-x64
                --self-contained true
                --output $(Build.ArtifactStagingDirectory)/win-x64
                --no-restore
                /p:PublishSingleFile=true
                /p:EnableCompressionInSingleFile=true
                /p:PublishTrimmed=false

          # Publish for Windows ARM64
          - task: DotNetCoreCLI@2
            displayName: 'Publish Windows ARM64'
            inputs:
              command: 'publish'
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --runtime win-arm64
                --self-contained true
                --output $(Build.ArtifactStagingDirectory)/win-arm64
                --no-restore
                /p:PublishSingleFile=true
                /p:EnableCompressionInSingleFile=true
                /p:PublishTrimmed=false

          # Publish for Linux x64
          - task: DotNetCoreCLI@2
            displayName: 'Publish Linux x64'
            inputs:
              command: 'publish'
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --runtime linux-x64
                --self-contained true
                --output $(Build.ArtifactStagingDirectory)/linux-x64
                --no-restore
                /p:PublishSingleFile=true
                /p:EnableCompressionInSingleFile=true
                /p:PublishTrimmed=false

          # Publish for Linux ARM64 (for Raspberry Pi, ARM servers)
          - task: DotNetCoreCLI@2
            displayName: 'Publish Linux ARM64'
            inputs:
              command: 'publish'
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --runtime linux-arm64
                --self-contained true
                --output $(Build.ArtifactStagingDirectory)/linux-arm64
                --no-restore
                /p:PublishSingleFile=true
                /p:EnableCompressionInSingleFile=true
                /p:PublishTrimmed=false

          # Publish for macOS x64 (Intel Macs)
          - task: DotNetCoreCLI@2
            displayName: 'Publish macOS x64'
            inputs:
              command: 'publish'
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --runtime osx-x64
                --self-contained true
                --output $(Build.ArtifactStagingDirectory)/osx-x64
                --no-restore
                /p:PublishSingleFile=true
                /p:EnableCompressionInSingleFile=true
                /p:PublishTrimmed=false

          # Publish for macOS ARM64 (Apple Silicon Macs)
          - task: DotNetCoreCLI@2
            displayName: 'Publish macOS ARM64'
            inputs:
              command: 'publish'
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --runtime osx-arm64
                --self-contained true
                --output $(Build.ArtifactStagingDirectory)/osx-arm64
                --no-restore
                /p:PublishSingleFile=true
                /p:EnableCompressionInSingleFile=true
                /p:PublishTrimmed=false

          # Create version info file
          - powershell: |
              $version = "$(Build.BuildNumber)"
              $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
              $commitId = "$(Build.SourceVersion)"
              
              $versionInfo = @{
                  Version = $version
                  BuildDate = $buildDate
                  CommitId = $commitId
                  Platforms = @("win-x64", "win-arm64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64")
              } | ConvertTo-Json -Depth 3
              
              $versionInfo | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/version.json" -Encoding utf8
            displayName: 'Create Version Info'

  - stage: Package
    displayName: 'Package Artifacts'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: CreatePackages
        displayName: 'Create Distribution Packages'
        steps:
          # Download build artifacts
          - download: current
            displayName: 'Download Build Artifacts'

          # Create ZIP packages for each platform
          - task: ArchiveFiles@2
            displayName: 'Package Windows x64'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/BuildRunners/win-x64'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/automaton-runner-win-x64-$(Build.BuildNumber).zip'
              replaceExistingArchive: true

          - task: ArchiveFiles@2
            displayName: 'Package Windows ARM64'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/BuildRunners/win-arm64'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/automaton-runner-win-arm64-$(Build.BuildNumber).zip'
              replaceExistingArchive: true

          - task: ArchiveFiles@2
            displayName: 'Package Linux x64'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/BuildRunners/linux-x64'
              includeRootFolder: false
              archiveType: 'tar'
              tarCompression: 'gz'
              archiveFile: '$(Build.ArtifactStagingDirectory)/automaton-runner-linux-x64-$(Build.BuildNumber).tar.gz'
              replaceExistingArchive: true

          - task: ArchiveFiles@2
            displayName: 'Package Linux ARM64'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/BuildRunners/linux-arm64'
              includeRootFolder: false
              archiveType: 'tar'
              tarCompression: 'gz'
              archiveFile: '$(Build.ArtifactStagingDirectory)/automaton-runner-linux-arm64-$(Build.BuildNumber).tar.gz'
              replaceExistingArchive: true

          - task: ArchiveFiles@2
            displayName: 'Package macOS x64'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/BuildRunners/osx-x64'
              includeRootFolder: false
              archiveType: 'tar'
              tarCompression: 'gz'
              archiveFile: '$(Build.ArtifactStagingDirectory)/automaton-runner-macos-x64-$(Build.BuildNumber).tar.gz'
              replaceExistingArchive: true

          - task: ArchiveFiles@2
            displayName: 'Package macOS ARM64'
            inputs:
              rootFolderOrFile: '$(Pipeline.Workspace)/BuildRunners/osx-arm64'
              includeRootFolder: false
              archiveType: 'tar'
              tarCompression: 'gz'
              archiveFile: '$(Build.ArtifactStagingDirectory)/automaton-runner-macos-arm64-$(Build.BuildNumber).tar.gz'
              replaceExistingArchive: true

          # Create checksums
          - powershell: |
              $files = Get-ChildItem "$(Build.ArtifactStagingDirectory)" -Filter "automaton-runner-*"
              $checksums = @()
              
              foreach ($file in $files) {
                  $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
                  $checksums += "$($hash.Hash.ToLower())  $($file.Name)"
              }
              
              $checksums | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/checksums.txt" -Encoding utf8
            displayName: 'Create Checksums'

          # Publish final packages
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Distribution Packages'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'automaton-runner-packages'
              publishLocation: 'Container'