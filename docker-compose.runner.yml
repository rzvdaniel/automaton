# Production Docker Compose for Automaton Runner
# Usage: docker compose -f docker-compose.runner.yml up -d
#
# Prerequisites:
#   1. Copy .env.example to .env
#   2. Configure AUTOMATON_SERVER_URL and AUTOMATON_API_KEY in .env
#
# See docs/runners/docker-runner.md for detailed setup instructions.

services:
  runner:
    build:
      context: ./src
      dockerfile: Automaton.Runner/Dockerfile
    image: automaton-runner:latest
    container_name: automaton-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AUTOMATON_WORKSPACE_ROOT=/automaton/workspace
      - RUNNER_SCRIPTS_DIR=/automaton/workspace/apps
      # Uncomment for local dev only (self-signed cert on localhost):
      # - DOTNET_ENVIRONMENT=Development
    command: ["/app/docker-entrypoint.sh"]
    volumes:
      # Persist runner configuration and registration
      - runner-config:/app/config
      # Persist logs
      - runner-logs:/app/logs
      # Persist runner workspace, deployed apps, and private app data
      - runner-workspace:/automaton/workspace
    networks:
      - runner-network

volumes:
  runner-config:
    driver: local
  runner-logs:
    driver: local
  runner-workspace:
    driver: local

networks:
  runner-network:
    driver: bridge
