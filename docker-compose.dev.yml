services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: automaton-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-AutomatonRoot123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automaton}
      MYSQL_USER: ${MYSQL_USER:-automaton_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-AutomatonPass123!}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Persist MySQL data
      - mysql-data:/var/lib/mysql
      # Optional: Add custom MySQL configuration
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      # Optional: Add initialization scripts
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - automaton-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-AutomatonRoot123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Automaton Studio Server (optional - uncomment to run server in Docker)
  # automaton-server:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.server
  #   container_name: automaton-server-dev
  #   restart: unless-stopped
  #   ports:
  #     - "7091:7091"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_URLS=https://+:7091
  #     - ConnectionStrings__MySqlConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-automaton};User=${MYSQL_USER:-automaton_user};Password=${MYSQL_PASSWORD:-AutomatonPass123!};
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - automaton-network
  #   volumes:
  #     - ./logs:/app/Logs

  # =============================================================================
  # Automaton Runner (Development)
  # =============================================================================
  # Prerequisites:
  #   1. Copy .env.example to .env
  #   2. Create an API key in Studio (Settings > API Keys)
  #   3. Add the API key to .env (AUTOMATON_API_KEY)
  #
  # Usage: docker compose -f docker-compose.dev.yml up runner-dev --build
  # =============================================================================
  runner-dev:
    build:
      context: ./src
      dockerfile: Automaton.Runner/Dockerfile
    image: automaton-runner-dev:latest
    container_name: automaton-runner-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOTNET_ENVIRONMENT=Development
      # Override production default to point to local server
      - AUTOMATON_SERVER_URL=https://host.docker.internal:7091
    volumes:
      # Persist runner configuration and registration
      - runner-config:/app/.config/AutomatonRunner
      # Persist logs
      - runner-logs:/app/logs
    networks:
      - automaton-network
    # Add host entry for Linux compatibility (optional, Windows/Mac use host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =============================================================================
  # smtp4dev — Local email capture (Development)
  # =============================================================================
  # Web UI:   http://localhost:3000  (view captured emails)
  # SMTP:     localhost:2525         (used by appsettings.Development.json)
  #
  # Usage: docker compose -f docker-compose.dev.yml up smtp4dev -d
  # =============================================================================
  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: automaton-smtp4dev
    restart: unless-stopped
    ports:
      - "3000:80"    # Web UI
      - "2525:25"    # SMTP
    networks:
      - automaton-network

volumes:
  mysql-data:
    driver: local
  runner-config:
    driver: local
  runner-logs:
    driver: local

networks:
  automaton-network:
    driver: bridge
