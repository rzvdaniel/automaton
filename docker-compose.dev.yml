services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16
    container_name: automaton-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-automaton}
      POSTGRES_USER: ${POSTGRES_USER:-automaton_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - automaton-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: automaton-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-automaton}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - automaton-network

  # Automaton Studio Server (optional - uncomment to run server in Docker)
  # automaton-server:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.server
  #   container_name: automaton-server-dev
  #   restart: unless-stopped
  #   ports:
  #     - "7091:7091"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_URLS=https://+:7091
  #     - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=${POSTGRES_DATABASE:-automaton};Username=${POSTGRES_USER:-automaton_user};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_started
  #   networks:
  #     - automaton-network
  #   volumes:
  #     - ./logs:/app/Logs

  # Automaton Worker (optional - uncomment to run the background worker in Docker)
  # automaton-worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker
  #   container_name: automaton-worker-dev
  #   restart: unless-stopped
  #   environment:
  #     - DOTNET_ENVIRONMENT=Development
  #     - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=${POSTGRES_DATABASE:-automaton};Username=${POSTGRES_USER:-automaton_user};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #     - AppConfig__WebsiteUrl=http://host.docker.internal:5173
  #     - AppConfig__ApiUrl=https://host.docker.internal:7091
  #     - RabbitMq__Host=rabbitmq
  #     - RabbitMq__Username=${RABBITMQ_USER:-automaton}
  #     - RabbitMq__Password=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  #     - Logging__File__Path=/app/logs
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_started
  #   networks:
  #     - automaton-network
  #   volumes:
  #     - worker-logs:/app/logs
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # =============================================================================
  # Automaton Runner (Development)
  # =============================================================================
  # Prerequisites:
  #   1. Copy .env.example to .env
  #   2. Create an API key in Studio (Settings > API Keys)
  #   3. Add the API key to .env (AUTOMATON_API_KEY)
  #
  # Usage: docker compose -f docker-compose.dev.yml up runner-dev --build
  # =============================================================================
  runner-dev:
    build:
      context: ./src
      dockerfile: Automaton.Runner/Dockerfile
    image: automaton-runner-dev:latest
    container_name: automaton-runner-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOTNET_ENVIRONMENT=Development
      # Override production default to point to local server
      - AUTOMATON_SERVER_URL=https://host.docker.internal:7091
      - AUTOMATON_WORKSPACE_ROOT=/automaton/workspace
      - RUNNER_SCRIPTS_DIR=/automaton/workspace/apps
    volumes:
      # Persist runner configuration and registration
      - runner-config:/app/config
      # Persist logs
      - runner-logs:/app/logs
      # Persist app workspace, runtime files, venvs, and private app data
      - runner-workspace:/automaton/workspace
    networks:
      - automaton-network
    # Add host entry for Linux compatibility (optional, Windows/Mac use host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =============================================================================
  # smtp4dev — Local email capture (Development)
  # =============================================================================
  # Web UI:   http://localhost:3000  (view captured emails)
  # SMTP:     localhost:2525         (used by appsettings.Development.json)
  #
  # Usage: docker compose -f docker-compose.dev.yml up smtp4dev -d
  # =============================================================================
  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: automaton-smtp4dev
    restart: unless-stopped
    ports:
      - "3000:80"    # Web UI
      - "2525:25"    # SMTP
    networks:
      - automaton-network

volumes:
  postgres-data:
    driver: local
  runner-config:
    driver: local
  runner-logs:
    driver: local
  runner-workspace:
    driver: local
  rabbitmq-data:
    driver: local
  worker-logs:
    driver: local

networks:
  automaton-network:
    driver: bridge
