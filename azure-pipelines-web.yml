# Static Website Build Pipeline
# Build and publish the Automaton.Web presentation website
# This creates an artifact with the static HTML, CSS, and JavaScript files

parameters:
    - name: isRelease
      displayName: Is a release build
      default: false
      type: boolean

trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - src/Automaton.Web/*

pr:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - src/Automaton.Web/*

jobs:

- job: AutomatonWebsite
  displayName: 'Build Automaton Presentation Website'
  
  pool:
    vmImage: 'ubuntu-latest'

  variables:
    websiteSourcePath: 'src/Automaton.Web'
    buildConfiguration: 'Release'

  steps:
  - checkout: self
    displayName: 'Checkout repository'

  # Copy website files to staging directory
  - task: CopyFiles@2
    displayName: 'Copy website files to staging'
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)/$(websiteSourcePath)'
      Contents: |
        **/*
        !README.md
        !**/.gitkeep
      TargetFolder: '$(Build.ArtifactStagingDirectory)/Automaton.Web'
      CleanTargetFolder: true


  # Create a simple manifest file with build information
  - task: PowerShell@2
    displayName: 'Create build manifest'
    inputs:
      targetType: 'inline'
      script: |
        $manifest = @{
          buildNumber = "$(Build.BuildNumber)"
          buildId = "$(Build.BuildId)"
          sourceVersion = "$(Build.SourceVersion)"
          sourceBranch = "$(Build.SourceBranchName)"
          buildDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          repository = "$(Build.Repository.Name)"
          isRelease = "${{ parameters.isRelease }}"
          websiteVersion = "1.0.0"
        }
        
        $manifestJson = $manifest | ConvertTo-Json -Depth 2
        $manifestPath = "$(Build.ArtifactStagingDirectory)/Automaton.Web/build-manifest.json"
        
        Set-Content $manifestPath $manifestJson
        Write-Host "Created build manifest:" -ForegroundColor Cyan
        Write-Host $manifestJson -ForegroundColor Gray

  # Publish the website artifact
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Automaton Website artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/Automaton.Web'
      artifact: 'Automaton.Web'
      publishLocation: 'pipeline'

  # Optional: Publish build summary
  - task: PowerShell@2
    displayName: 'Publish build summary'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "##[section]Automaton Website Build Completed Successfully"
        Write-Host "Artifact Name: Automaton.Web"
        Write-Host "Build Configuration: $(buildConfiguration)"
        Write-Host "Source Branch: $(Build.SourceBranchName)"
        Write-Host "Commit: $(Build.SourceVersion)"
        Write-Host ""
        Write-Host "The website artifact is ready for deployment to:"
        Write-Host "- Static hosting services (Netlify, Vercel, GitHub Pages)"
        Write-Host "- CDN distributions"  
        Write-Host "- Web servers"
        Write-Host ""
        Write-Host "Artifact contains:"
        Write-Host "- index.html (main website)"
        Write-Host "- styles/main.css (styling)"
        Write-Host "- scripts/main.js (functionality)"
        Write-Host "- assets/ (logos and images)"
        Write-Host "- build-manifest.json (build metadata)"