apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Delete Hosted Runner
  key: delete-hosted-runner
  description: Removes a managed Runner and its owned app runtimes from an approved Runner Host, then applies the requested storage disposition.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 120
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, containerName, preserveVolumes, systemVolumeName, userVolumeName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      containerName: { type: string }
      preserveVolumes: { type: boolean }
      systemVolumeName: { type: string }
      userVolumeName: { type: string }
  output:
    type: object
    required: [success, containerName]
    properties:
      success: { type: boolean }
      containerName: { type: string }
