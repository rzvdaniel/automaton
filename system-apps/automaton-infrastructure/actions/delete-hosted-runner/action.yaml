apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Delete Hosted Runner
  key: delete-hosted-runner
  description: Removes a managed Runner container from an approved Runner Host.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 120
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, containerName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      containerName: { type: string }
  output:
    type: object
    required: [success, containerName]
    properties:
      success: { type: boolean }
      containerName: { type: string }
