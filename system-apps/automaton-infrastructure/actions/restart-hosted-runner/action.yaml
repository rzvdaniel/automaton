apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Restart Hosted Runner
  key: restart-hosted-runner
  description: Restarts a managed Runner container on an approved Runner Host.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 120
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, containerName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      containerName: { type: string }
  output:
    type: object
    required: [success, containerName]
    properties:
      success: { type: boolean }
      containerName: { type: string }
