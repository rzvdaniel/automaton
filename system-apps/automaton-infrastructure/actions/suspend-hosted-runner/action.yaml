apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Suspend Hosted Runner
  key: suspend-hosted-runner
  description: Stops a managed Runner container without deleting its persistent volumes.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 120
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, expectedContainerName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      expectedContainerName: { type: string }
  output:
    type: object
    required: [success, containerName]
    properties:
      success: { type: boolean }
      containerName: { type: string }
