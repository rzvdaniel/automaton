apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Reprovision Hosted Runner
  key: reprovision-hosted-runner
  description: Recreates a managed Runner container on an approved Runner Host.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 300
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, userId, containerName, image, apiUrl, cpuLimit, memoryMb, memoryReservationMb, diskLimitMb, xfsProjectId, pidsLimit, sharedMemoryMb, dockerLogMaxSizeMb, dockerLogMaxFiles, runnerPort, networkName, systemVolumeName, userVolumeName, specificationId, runnerName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      userId: { type: string }
      containerName: { type: string }
      image: { type: string }
      apiUrl: { type: string }
      cpuLimit: { type: number }
      memoryMb: { type: integer }
      memoryReservationMb: { type: integer }
      diskLimitMb: { type: integer }
      xfsProjectId: { type: integer }
      pidsLimit: { type: integer }
      sharedMemoryMb: { type: integer }
      dockerLogMaxSizeMb: { type: integer }
      dockerLogMaxFiles: { type: integer }
      runnerPort: { type: integer }
      networkName: { type: string }
      systemVolumeName: { type: string }
      userVolumeName: { type: string }
      specificationId: { type: string }
      runnerName: { type: string }
  output:
    type: object
    required: [success, containerId, containerName]
    properties:
      success: { type: boolean }
      containerId: { type: string }
      containerName: { type: string }
      publishedPort: { type: integer }
