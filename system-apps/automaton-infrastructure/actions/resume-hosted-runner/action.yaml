apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Resume Hosted Runner
  key: resume-hosted-runner
  description: Starts an existing managed Runner container without changing its persistent volumes.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 120
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, containerName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      containerName: { type: string }
  output:
    type: object
    required: [success, containerName]
    properties:
      success: { type: boolean }
      containerName: { type: string }
