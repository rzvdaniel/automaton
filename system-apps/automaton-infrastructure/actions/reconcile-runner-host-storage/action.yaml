apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Reconcile Runner Host Storage
  key: reconcile-runner-host-storage
  description: Reconciles due Runner Host storage telemetry through the Worker.
spec:
  runtime: bash
  entrypoint: main.sh
  timeoutSeconds: 120
  schedulable: true
  allowedExecutionScopes: [Worker]
  minimumIntervalSeconds: 60
  input: { type: object }
  output: { type: object }
