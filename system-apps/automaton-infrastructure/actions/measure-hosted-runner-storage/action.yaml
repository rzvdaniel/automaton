apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Measure Hosted Runner Storage
  key: measure-hosted-runner-storage
  description: Measures deterministic, ownership-validated managed Runner volumes.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 120
  capabilities: [docker, host]
  input:
    type: object
    required: [operationId, hostedRunnerId, runnerHostId, expectedSystemVolumeName, expectedUserVolumeName]
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      runnerHostId: { type: string }
      expectedSystemVolumeName: { type: string }
      expectedUserVolumeName: { type: string }
  output:
    type: object
    required: [success, systemBytes, userBytes, totalBytes]
    properties:
      success: { type: boolean }
      systemBytes: { type: integer }
      userBytes: { type: integer }
      totalBytes: { type: integer }
