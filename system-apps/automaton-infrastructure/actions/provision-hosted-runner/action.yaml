apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Provision Hosted Runner
  key: provision-hosted-runner
  description: Creates a managed Runner container on an approved Runner Host.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 300
  capabilities:
    - docker
    - host
  input:
    type: object
    required:
      - operationId
      - hostedRunnerId
      - userId
      - containerName
      - image
      - apiUrl
      - cpuLimit
      - memoryMb
      - memoryReservationMb
      - diskLimitMb
      - writableLayerSizeLimitMb
      - xfsProjectId
      - pidsLimit
      - sharedMemoryMb
      - dockerLogMaxSizeMb
      - dockerLogMaxFiles
      - runnerPort
      - networkName
      - systemVolumeName
      - userVolumeName
      - specificationId
      - runnerName
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      userId: { type: string }
      containerName: { type: string }
      image: { type: string }
      apiUrl: { type: string }
      cpuLimit: { type: number }
      memoryMb: { type: integer }
      memoryReservationMb: { type: integer }
      diskLimitMb: { type: integer }
      writableLayerSizeLimitMb: { type: integer }
      xfsProjectId: { type: integer }
      storageFilesystemUuid: { type: string }
      pidsLimit: { type: integer }
      sharedMemoryMb: { type: integer }
      dockerLogMaxSizeMb: { type: integer }
      dockerLogMaxFiles: { type: integer }
      runnerPort: { type: integer }
      networkName: { type: string }
      systemVolumeName: { type: string }
      userVolumeName: { type: string }
      specificationId: { type: string }
      runnerName: { type: string }
  output:
    type: object
    required: [success, containerId, containerName, storageFilesystemUuid]
    properties:
      success: { type: boolean }
      containerId: { type: string }
      containerName: { type: string }
      storageFilesystemUuid: { type: string }
      publishedPort: { type: integer }
