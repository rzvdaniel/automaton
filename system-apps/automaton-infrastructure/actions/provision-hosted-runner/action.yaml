apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Provision Hosted Runner
  key: provision-hosted-runner
  description: Creates a managed Runner container on an approved Runner Host.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 300
  capabilities:
    - docker
    - host
  input:
    type: object
    required:
      - operationId
      - hostedRunnerId
      - userId
      - containerName
      - image
      - apiUrl
      - cpuLimit
      - memoryMb
      - memoryReservationMb
      - pidsLimit
      - runnerPort
      - networkName
      - volumeName
      - dataRoot
      - runnerName
    properties:
      operationId: { type: string }
      hostedRunnerId: { type: string }
      userId: { type: string }
      containerName: { type: string }
      image: { type: string }
      apiUrl: { type: string }
      cpuLimit: { type: number }
      memoryMb: { type: integer }
      memoryReservationMb: { type: integer }
      pidsLimit: { type: integer }
      runnerPort: { type: integer }
      networkName: { type: string }
      volumeName: { type: string }
      dataRoot: { type: string }
      runnerName: { type: string }
  output:
    type: object
    required: [success, containerId, containerName]
    properties:
      success: { type: boolean }
      containerId: { type: string }
      containerName: { type: string }
      publishedPort: { type: integer }
