apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Reconcile Hosted Runner Storage
  key: reconcile-hosted-runner-storage
  description: Reconciles due hosted Runner storage telemetry through the Worker.
spec:
  runtime: bash
  entrypoint: main.sh
  timeoutSeconds: 120
  schedulable: true
  allowedExecutionScopes: [Worker]
  minimumIntervalSeconds: 60
  input: { type: object }
  output: { type: object }
