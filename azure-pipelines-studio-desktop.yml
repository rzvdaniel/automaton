# Azure DevOps Pipeline for Automaton Studio Desktop
# Builds Windows desktop application with self-contained deployment
# Generates ready-to-deploy packages for Windows x64 and ARM64

parameters:
    - name: isRelease
      displayName: Is a release build
      default: false
      type: boolean
      
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Automaton.Studio.Desktop/**
      - src/Automaton.Studio/**
      - src/Automaton.Core/**
      - src/Automaton.Steps/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Automaton.Studio.Desktop/**
      - src/Automaton.Studio/**
      - src/Automaton.Core/**
      - src/Automaton.Steps/**

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  desktopProjectPath: 'src/Automaton.Studio.Desktop/Automaton.Studio.Desktop.csproj'
  artifactName: 'automaton-studio-desktop'
  majorVersion: 1
  minorVersion: 0
  patchVersion: 0

stages:
  - stage: BuildAndPackage
    displayName: 'Build and Package Desktop Application'
    jobs:
      - job: BuildDesktopPackages
        displayName: 'Build Desktop Application Packages'
        steps:
          # Setup .NET SDK
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
              installationPath: $(Agent.ToolsDirectory)/dotnet

          # Set build version
          - powershell: |
              $buildNumber = "$(majorVersion).$(minorVersion).$(patchVersion).$(Build.BuildId)"
              Write-Host "##vso[build.updatebuildnumber]$buildNumber"
              Write-Host "##vso[task.setvariable variable=buildNumber]$buildNumber"
              echo "Build version: $buildNumber"
            displayName: 'Set Build Version'

          # Restore dependencies for desktop project only
          - task: DotNetCoreCLI@2
            displayName: 'Restore Desktop Project'
            inputs:
              command: 'restore'
              projects: '$(desktopProjectPath)'
              feedsToUse: 'select'
              verbosityRestore: 'minimal'

          # Build desktop project
          - task: DotNetCoreCLI@2
            displayName: 'Build Desktop Project'
            inputs:
              command: 'build'
              projects: '$(desktopProjectPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore -p:Version=$(buildNumber) -p:AssemblyVersion=$(buildNumber) -p:FileVersion=$(buildNumber)'

          # Run tests (if any exist for desktop)
          - task: DotNetCoreCLI@2
            displayName: 'Run Desktop Tests'
            inputs:
              command: 'test'
              projects: 'src/UnitTests/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --logger trx --results-directory $(Agent.TempDirectory) --collect:"XPlat Code Coverage"'
            continueOnError: true
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          # Create temporary directories for builds
          - script: |
              mkdir "$(Agent.TempDirectory)\builds\win-x64"
              mkdir "$(Agent.TempDirectory)\builds\win-arm64"
              mkdir "$(Agent.TempDirectory)\installers"
            displayName: 'Create Build Directories'

          # Publish Windows x64 self-contained
          - task: DotNetCoreCLI@2
            displayName: 'Publish Desktop App - Windows x64'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(desktopProjectPath)'
              arguments: '--configuration $(buildConfiguration) --runtime win-x64 --self-contained true --output "$(Agent.TempDirectory)/builds/win-x64" -p:PublishSingleFile=false -p:Version=$(buildNumber) -p:AssemblyVersion=$(buildNumber) -p:FileVersion=$(buildNumber) -p:IncludeNativeLibrariesForSelfExtract=true'
              zipAfterPublish: false

          # Publish Windows ARM64 self-contained
          - task: DotNetCoreCLI@2
            displayName: 'Publish Desktop App - Windows ARM64'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(desktopProjectPath)'
              arguments: '--configuration $(buildConfiguration) --runtime win-arm64 --self-contained true --output "$(Agent.TempDirectory)/builds/win-arm64" -p:PublishSingleFile=false -p:Version=$(buildNumber) -p:AssemblyVersion=$(buildNumber) -p:FileVersion=$(buildNumber) -p:IncludeNativeLibrariesForSelfExtract=true'
              zipAfterPublish: false

          # Create ZIP packages for both architectures
          - task: ArchiveFiles@2
            displayName: 'Package Windows x64 ZIP'
            inputs:
              rootFolderOrFile: '$(Agent.TempDirectory)/builds/win-x64'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/AutomatonStudioDesktop-win-x64.zip'
              replaceExistingArchive: true

          - task: ArchiveFiles@2
            displayName: 'Package Windows ARM64 ZIP'
            inputs:
              rootFolderOrFile: '$(Agent.TempDirectory)/builds/win-arm64'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/AutomatonStudioDesktop-win-arm64.zip'
              replaceExistingArchive: true

          # Create version info
          - powershell: |
              $version = "$(buildNumber)"
              $commitHash = "$(Build.SourceVersion)".Substring(0, 8)
              $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
              
              $versionInfo = @{
                  version = $version
                  buildNumber = "$(Build.BuildNumber)"
                  commitHash = $commitHash
                  buildDate = $buildDate
                  sourcesBranch = "$(Build.SourceBranchName)"
                  platforms = @("win-x64", "win-arm64")
                  packageTypes = @("zip")
                  application = "Automaton Studio Desktop"
                  description = "Windows desktop application with workflow designer and local execution"
                  systemRequirements = @{
                      os = "Windows 10 version 1809 or later, Windows 11"
                      runtime = ".NET 8 (included in self-contained deployment)"
                      memory = "4GB RAM minimum"
                      disk = "500MB available space"
                  }
              } | ConvertTo-Json -Depth 3
              
              $versionInfo | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/version.json" -Encoding utf8
            displayName: 'Create Version Info'

          # Create checksums
          - powershell: |
              $files = Get-ChildItem "$(Build.ArtifactStagingDirectory)" -Filter "AutomatonStudioDesktop-*"
              $checksums = @()
              
              foreach ($file in $files) {
                  $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
                  $checksums += "$($hash.Hash.ToLower())  $($file.Name)"
              }
              
              $checksums | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/checksums.txt" -Encoding utf8
            displayName: 'Create Checksums'

          # Create installation instructions for ZIP packages
          - powershell: |
              $instructions = @"
              # Automaton Studio Desktop - Installation Instructions

              ## System Requirements
              - Windows 10 version 1809 or later / Windows 11
              - .NET 8 Desktop Runtime (included in self-contained packages)
              - Minimum 4GB RAM
              - 500MB available disk space

              ## Installation (Portable ZIP)
              1. Download the appropriate ZIP file for your system:
                 - **AutomatonStudioDesktop-win-x64-$(buildNumber).zip** (64-bit Intel/AMD - Most Common)
                 - **AutomatonStudioDesktop-win-arm64-$(buildNumber).zip** (64-bit ARM - Surface Pro X, etc.)
              
              2. Extract to your preferred location:
                 - **Recommended:** ``C:\Tools\AutomatonStudio``
                 - **Alternative:** ``%USERPROFILE%\Applications\AutomatonStudio``
              
              3. Run ``Automaton.Studio.Desktop.exe`` from the extracted folder

              ## First Run
              - The application starts with a local workflow designer
              - Create your first workflow using the visual interface
              - All workflows execute locally on your machine

              ## Features
              - Visual workflow designer with drag-and-drop interface
              - Local workflow execution engine
              - Integrated management interface
              - Self-contained deployment (no external dependencies)

              ## For System Administrators
              - No registry modifications
              - No system-wide changes
              - Can be deployed via GPO or configuration management tools
              - Multiple versions can coexist in different folders
              - Easy to remove (just delete the folder)

              ## Troubleshooting
              - **Application won't start:** Ensure Windows is up to date
              - **Permission issues:** Try running from a user-writable location
              - **Missing dependencies:** All required .NET libraries are included
              - **Detailed errors:** Check Windows Event Viewer (Application logs)

              ## Uninstallation
              Simply delete the extracted folder - no traces left on the system.

              ---
              **Build Information:**
              - Version: $(buildNumber)
              - Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
              - Source Branch: $(Build.SourceBranchName)
              - Target Audience: Developers, System Administrators, DevOps Engineers
              "@
              
              $instructions | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/INSTALL.md" -Encoding utf8
            displayName: 'Create Installation Instructions'

          # Show final artifacts
          - powershell: |
              Write-Host "Final artifacts in staging directory:"
              Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)" | ForEach-Object {
                Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
              }
            displayName: 'List Final Artifacts'

          - task: FileTransform@1
            displayName: Transform appsettings
            condition: eq(${{ parameters.isRelease }}, false)
            inputs:
              folderPath: '$(build.ArtifactStagingDirectory)'
              fileType: 'json'
              targetFiles: '**/appsettings.json'

          # Publish artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Desktop Application Packages'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'automaton-studio-desktop-packages'
              publishLocation: 'Container'